rules:
  - id: react-native.authentication.expo-auth-session-pkce-disabled
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: Expo AuthSession explicitly disables PKCE.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-940: Improper Verification of Source of a Communication Channel'
      impact: HIGH
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/940.html
        - https://mas.owasp.org/MASVS/controls/MASVS-AUTH-1/
      subcategory:
        - vuln
      technology:
        - react-native
        - expo
        - oauth
    pattern-either:
      - pattern: 'AuthSession.startAsync({... , usePKCE: false, ...})'
      - pattern: 'useAuthRequest({... , usePKCE: false, ...}, ...)'

  - id: react-native.authentication.jwt-decoded-without-expiry-check
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: JWT is decoded but its expiration claim is not checked in the same function.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-613: Insufficient Session Expiration'
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/613.html
        - https://mas.owasp.org/MASVS/controls/MASVS-AUTH-2/
      subcategory:
        - vuln
      technology:
        - react-native
        - jwt
    patterns:
      - pattern-inside: |
          function $FUNC(...) {
            ...
          }
      - pattern: $PAYLOAD = jwtDecode($TOKEN)
      - pattern-not-inside: |
          function $FUNC(...) {
            ...
            $PAYLOAD.exp
            ...
          }

  - id: react-native.authentication.insecure-random-token
    languages:
      - javascript
      - typescript
    severity: ERROR
    message: Math.random is not suitable for tokens, nonces, identifiers, or cryptographic secrets.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)'
      impact: HIGH
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/338.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CRYPTO-1/
      subcategory:
        - vuln
      technology:
        - react-native
    patterns:
      - pattern: $NAME = Math.random(...)
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(token|nonce|secret|key|session|otp|code|uuid).*

  - id: react-native.authentication.textinput-sensitive-not-secure
    languages:
      - javascript
      - typescript
    severity: WARNING
    message: Sensitive TextInput does not enable secureTextEntry.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-200: Exposure of Sensitive Information to an Unauthorized Actor'
      impact: LOW
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/200.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-3/
      subcategory:
        - vuln
      technology:
        - react-native
    patterns:
      - pattern: <TextInput ... placeholder=$PLACEHOLDER ... />
      - pattern-not: <TextInput ... secureTextEntry={true} ... />
      - metavariable-regex:
          metavariable: $PLACEHOLDER
          regex: (?i).*(password|passcode|pin|cvv|secret).*
