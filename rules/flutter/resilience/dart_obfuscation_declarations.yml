rules:
  - id: flutter.apiiro.dart-obfuscation-declarations
    languages:
      - dart
    severity: ERROR
    message: Obfuscated declarations names.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-506: Embedded Malicious Code'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/506.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - flutter
    patterns:
      - pattern-either:
          - pattern: class $VAR {}
          - pattern: var $VAR = ...;
          - pattern: $TYPE $VAR;
          - pattern: void $VAR(...) { ... }
          - pattern: $TYPE $VAR(...) { ... }
          - pattern: final $TYPE $VAR = ...;
          - pattern: const $TYPE $VAR = ...;
      - metavariable-pattern:
          metavariable: $VAR
          pattern-regex: ^\d|(.)\1{3,}|.{128,}|^_0x|([^a-zA-Z0-9_])
