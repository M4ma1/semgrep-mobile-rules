rules:
  - id: flutter.apiiro.dart-obfuscation-conditions
    languages:
      - dart
    severity: WARNING
    message: Obfuscation by spurious conditions.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-506: Embedded Malicious Code'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/506.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - flutter
    patterns:
      - pattern-regex: ^.{,401}$
      - pattern-not-inside: '...'
      - pattern-not: while (true) { ... }
      - pattern-either:
          - pattern: if ($VAR) { ... }
          - pattern: while ($VAR) { ... }
          - pattern: switch ($VAR) { ... }
      - metavariable-regex:
          metavariable: $VAR
          # Match all non-literals, or the listed literals.
          regex: ^(?!.*(?<!['"`])\b(?!true|false|null)[a-zA-Z_!]).*$
