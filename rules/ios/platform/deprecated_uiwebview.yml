rules:
  - id: ios.deprecated_uiwebview
    languages:
      - swift
    severity: WARNING
    message: >-
      This iOS mobile application seems using an insecure WebView in-app browser, which could
      expose to various kind of vulnerabilities. More specifically, the usage of the deprecated
      `UIWebView` should be avoided, because it suffers of various security issues. It is
      recommended to use the `WKWebView` component properly configured in the mobile app, if the
      usage of `SFSafariViewController` is a requirements, it is suggested to adopt it only in
      trusted contexts.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-749: Exposed Dangerous Method or Function'
      impact: HIGH
      likelihood: HIGH
      references:
        - https://mas.owasp.org/MASTG/tests/ios/MASVS-PLATFORM/MASTG-TEST-0076/
        - https://cwe.mitre.org/data/definitions/749.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-2/
      subcategory:
        - vuln
      technology:
        - ios
      owasp-mas:
        identifier: MASVS-PLATFORM-2
        area: platform
        level:
          - L1
          - L2
    pattern: UIWebView
