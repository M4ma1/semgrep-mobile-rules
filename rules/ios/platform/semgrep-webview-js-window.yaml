rules:
  - id: ios.semgrep.swift-webview-config-allows-js-open-windows
    languages:
      - swift
    severity: WARNING
    message: >-
      Webviews were observed that explictly allow JavaScript in an WKWebview to open windows
      automatically. Consider disabling this functionality if not required, following the
      principle of least privelege.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-272: Least Privilege Violation'
      impact: LOW
      likelihood: LOW
      references:
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-2/
        - https://developer.apple.com/documentation/webkit/wkpreferences/1536573-javascriptcanopenwindowsautomati
        - https://cwe.mitre.org/data/definitions/272.html
      subcategory:
        - vuln
      technology:
        - ios
        - macos
      masvs:
        - 'MASVS-PLATFORM-2: The app uses WebViews securely'
    patterns:
      - pattern: |
          $P = WKPreferences()
          ...
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  $P.JavaScriptCanOpenWindowsAutomatically  = $FALSE
                  ...
                  $P.JavaScriptCanOpenWindowsAutomatically  = $TRUE
              # nosemgrep
              - pattern-not-inside: |
                  ...
                  $P.JavaScriptCanOpenWindowsAutomatically  = $TRUE
                  ...
                  $P.JavaScriptCanOpenWindowsAutomatically = $FALSE
              - pattern: |
                  $P.JavaScriptCanOpenWindowsAutomatically  = true
              - metavariable-regex:
                  metavariable: $TRUE
                  regex: ^(true)$
              - metavariable-regex:
                  metavariable: $TRUE
                  regex: (.*(?!true))
          - patterns:
              - pattern: |
                  $P.JavaScriptCanOpenWindowsAutomatically  = true
              # nosemgrep
              - pattern-not-inside: |
                  ...
                  $P.JavaScriptCanOpenWindowsAutomatically  = ...
                  ...
                  $P.JavaScriptCanOpenWindowsAutomatically  = ...
