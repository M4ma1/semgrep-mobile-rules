rules:
  - id: ios.insecure_pasteboard
    languages:
      - swift
    severity: WARNING
    message: >-
      This iOS mobile application seems to be using the systemwide general pasteboard, which
      could expose to various kind of vulnerabilities. Please ensure that the application do not
      expose sensitive data through the general pasteboard since any other application can read
      it.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-200: Exposure of Sensitive Information to an Unauthorized Actor'
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://mas.owasp.org/MASTG/tests/ios/MASVS-PLATFORM/MASTG-TEST-0073/
        - https://cwe.mitre.org/data/definitions/200.html
        - https://mas.owasp.org/MASVS/controls/MASVS-STORAGE-2/
      subcategory:
        - vuln
      technology:
        - ios
      owasp-mas:
        identifier: MASVS-PLATFORM-1
        area: platform
        level:
          - L1
          - L2
    pattern: UIPasteboard.general
