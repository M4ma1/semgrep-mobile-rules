rules:
  - id: ios.deprecated_persistent_pasteboard
    languages:
      - swift
    severity: WARNING
    message: >-
      This iOS mobile application seems to be using a persistent pasteboard, which could expose
      to various kind of vulnerabilities. Persistent pasteboard are deprecated since iOS 10. If
      you wish to share data between your applications, please use a shared app group container.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-200: Exposure of Sensitive Information to an Unauthorized Actor'
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://mas.owasp.org/MASTG/tests/ios/MASVS-PLATFORM/MASTG-TEST-0073/
        - https://developer.apple.com/library/archive/documentation/Miscellaneous/Reference/EntitlementKeyReference/Chapters/EnablingAppSandbox.html#//apple_ref/doc/uid/TP40011195-CH4-SW19
        - https://cwe.mitre.org/data/definitions/200.html
        - https://mas.owasp.org/MASVS/controls/MASVS-STORAGE-2/
      subcategory:
        - vuln
      technology:
        - ios
      owasp-mas:
        identifier: MASVS-PLATFORM-1
        area: platform
        level:
          - L1
          - L2
    pattern: $PASTEBOARD.setPersistent(true)
