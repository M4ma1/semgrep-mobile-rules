rules:
  - id: ios.akabe1.critical-device-features
    languages:
      - swift
    severity: WARNING
    message: >-
      This iOS mobile application seems calling critical device features (like: send SMS, make
      phone call, or send email) during its functioning. Given the sensitivity of these features
      developers must take caution when using them, because theyir misuse could expose the users
      to various kind of attacks (i.e. sending reserved data via cleartext SMS, spamming via
      emails/SMS, unintended phone call frauds, etc.).
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-749: Exposed Dangerous Method or Function'
      impact: LOW
      likelihood: LOW
      references:
        - https://owasp.org/www-project-automated-threats-to-web-applications/assets/oats/EN/OAT-017_Spamming
        - https://owasp.org/www-pdf-archive/AMS_OWASP.pdf
        - https://cwe.mitre.org/data/definitions/749.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-1/
      subcategory:
        - vuln
      technology:
        - ios
      authors:
        - Maurizio Siddu
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  # Found email and/or SMS controllers
                  - pattern: |
                      $OBJ = MFMailComposeViewController(...) 
                  - pattern: |
                      $OBJ = MFMessageComposeViewController(...)
          - patterns:
              # Found urls of phone call, SMS and/or email
              - pattern-inside: |
                  $OBJ = URL(string: $VALUE)
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)"(tel|sms|mailto)://[\s\S]*"
          - patterns:
              # Found nsurls of phone call, SMS and/or email
              - pattern-inside: |
                  $OBJ = NSURL(string: $VALUE)
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)"(tel|sms|mailto):[\s\S]*"
