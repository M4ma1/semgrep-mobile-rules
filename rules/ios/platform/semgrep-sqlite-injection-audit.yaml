rules:
  - id: ios.semgrep.swift-potential-sqlite-injection
    languages:
      - swift
    severity: WARNING
    message: >-
      Potential Client-side SQL injection which has different impacts depending on the SQL
      use-case. The impact may include the circumvention of local authentication mechanisms,
      obtaining of sensitive data from the app, or manipulation of client-side behavior. It
      wasn't possible to make certain that the source is untrusted, but the application should
      avoid concatenating dynamic data into SQL queries and should instead leverage parameterized
      queries.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://developer.apple.com/library/archive/documentation/Security/Conceptual/SecureCodingGuide/Articles/ValidatingInput.html
        - https://cwe.mitre.org/data/definitions/89.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - ios
        - macos
      masvs:
        - 'MASVS-CODE-4: The app validates and sanitizes all untrusted inputs.'
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: |
              "...\($X)..."
          - pattern: |
              $SQL = "..." + $X
          - pattern: |
              $SQL = $X + "..."
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: sqlite3_exec($DB, $SQL, ...)
              - pattern: sqlite3_prepare_v2($DB, $SQL, ...)
          - focus-metavariable:
              - $SQL
