rules:
  - id: ios.improper_biometric
    languages:
      - swift
    severity: WARNING
    message: >-
      This iOS mobile application seems using an insecure biometric API, which could expose to
      various kind of vulnerabilities. More specifically, the usage of
      `LocalAuthentication.framework` should be avoided, because it suffers of various security
      issues. It is recommended to use `Security.framework`.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-287: Improper Authentication'
      impact: HIGH
      likelihood: HIGH
      references:
        - https://mas.owasp.org/MASTG/tests/ios/MASVS-AUTH/MASTG-TEST-0064/
        - https://cwe.mitre.org/data/definitions/287.html
        - https://mas.owasp.org/MASVS/controls/MASVS-AUTH-2/
      subcategory:
        - vuln
      technology:
        - ios
      owasp-mas:
        identifier: MASVS-AUTH-2
        area: authentication
        level:
          - L2
    pattern-either:
      - patterns:
          - pattern-inside: |
              $CONTEXT = LAContext(...)
              ...
              $CONTEXT.$FUNC(...)
          - focus-metavariable: $FUNC
          - metavariable-regex:
              metavariable: $FUNC
              regex: (evaluatePolicy)
