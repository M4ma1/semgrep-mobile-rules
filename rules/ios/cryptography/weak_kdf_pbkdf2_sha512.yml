rules:
  - id: ios.weak_kdf_pbkdf2_sha512
    languages:
      - swift
    severity: WARNING
    message: >-
      This iOS mobile application seems using a key derivation function, `PBKDF2`, configured
      weakly, which could expose to various kind of vulnerabilities. PBKDF2 function using the
      SHA-512 hashing algorithm should be used with at least 600 000 iterations based on OWASP
      recommendation. Please consider implementation of algorithms recognized by Password Hashing
      Competition (PHC) like Argon2, for critical keys.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-916: Use of Password Hash With Insufficient Computational Effort'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html#pbkdf2
        - https://mas.owasp.org/MASTG/General/0x04g-Testing-Cryptography/#weak-key-generation-functions
        - https://github.com/p-h-c/phc-winner-argon2
        - https://cwe.mitre.org/data/definitions/916.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CRYPTO-1/
      subcategory:
        - vuln
      technology:
        - ios
      owasp-mas:
        identifier: MASVS-CRYPTO-1
        area: cryptography
        level:
          - L1
          - L2
    patterns:
      - pattern: |
          CCKeyDerivationPBKDF($ALGO, $PASS, $PASS_COUNT, $SALT, $SALT_COUNT, CCPseudoRandomAlgorithm(kCCPRFHmacAlgSHA512), $ITERATIONS, $KEY, $KEY_C0UNT)
      - focus-metavariable: $ITERATIONS
      - metavariable-comparison:
          metavariable: $ITERATIONS
          comparison: $ITERATIONS < 210000
