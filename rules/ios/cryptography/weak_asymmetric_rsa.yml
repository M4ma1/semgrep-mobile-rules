rules:
  - id: ios.weak_asymmetric_rsa
    languages:
      - swift
    severity: WARNING
    message: >-
      This iOS mobile application seems using an asymmetric algorithm, `RSA`, which might be
      configured weakly, which could expose to various kind of vulnerabilities. RSA keys should
      be at least 3072 bits based on NIST recommendation.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-326: Inadequate Encryption Strength'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html#algorithms
        - https://mas.owasp.org/MASTG/General/0x04g-Testing-Cryptography/#insufficient-key-length
        - https://www.keylength.com/en/4/
        - https://cwe.mitre.org/data/definitions/326.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CRYPTO-1/
      subcategory:
        - vuln
      technology:
        - ios
      owasp-mas:
        identifier: MASVS-CRYPTO-1
        area: cryptography
        level:
          - L1
          - L2
    pattern: kSecAttrKeyTypeRSA
