rules:
  - id: ios.insecure_hash_md4
    languages:
      - swift
    severity: WARNING
    message: >-
      This iOS mobile application seems using the insecure MD4 algorithm, which could expose to
      various kind of vulnerabilities. It is recommended to use the `SHA-256` or `SHA3` algorithm
      instead.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-328: Use of Weak Hash'
      impact: HIGH
      likelihood: HIGH
      references:
        - https://mas.owasp.org/MASTG/General/0x04g-Testing-Cryptography/#identifying-insecure-andor-deprecated-cryptographic-algorithms
        - https://cwe.mitre.org/data/definitions/328.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CRYPTO-1/
      subcategory:
        - vuln
      technology:
        - ios
      owasp-mas:
        identifier: MASVS-CRYPTO-1
        area: cryptography
        level:
          - L1
          - L2
    pattern-either:
      - pattern: CC_MD4_Init($CTX)
      - pattern: CC_MD4_Update($CTX, $DATA, $LEN)
      - pattern: CC_MD4_Final($MD, $CTX)
      - pattern: CC_MD4($DATA, $LEN, $MD)
