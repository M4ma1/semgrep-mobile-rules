rules:
  - id: ios.akabe1.trustkit-pinning
    languages:
      - swift
    severity: WARNING
    message: >-
      This iOS mobile application seems not implementing properly the Certificate Pinning checks
      when connecting to external web servers, with TrustKit libraries. An attacker could be able
      to abuse this vulnerability in order to intercept the communications and perform MitM
      attacks. It is recommended to implement the proper Certificate Pinning controls in the iOS
      mobile application following the official security guidelines for iOS.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-295: Improper Certificate Validation'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://owasp.org/www-community/controls/Certificate_and_Public_Key_Pinning
        - https://developer.apple.com/news/?id=g9ejcf8y
        - https://cwe.mitre.org/data/definitions/295.html
        - https://cwe.mitre.org/data/definitions/297.html
        - https://cwe.mitre.org/data/slices/919.html
        - https://mas.owasp.org/MASVS/controls/MASVS-NETWORK-2/
      subcategory:
        - vuln
      technology:
        - ios
      authors:
        - Maurizio Siddu
    patterns:
      - pattern-either:
          # TrustKit with improper pinning configurations (pinning disabled or disabled for subdomains)
          - patterns:
              - pattern-inside: |
                  let $TRUSTKITCONF: $TY = $VALUE
              - metavariable-regex:
                  metavariable: $TY
                  regex: (?i)^\[\s*String\s*:\s*Any\s*\]$
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)\[([\s\S]*?)(?=kTSKEnforcePinning:\s?false)([\s\S]*?)\]
          - patterns:
              - pattern-inside: |
                  let $TRUSTKITCONF: $TY = $VALUE
              - metavariable-regex:
                  metavariable: $TY
                  regex: (?i)^\[\s*String\s*:\s*Any\s*\]$
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)\[([\s\S]*?)(?=kTSKIncludeSubdomains:\s?false)([\s\S]*?)\]
          - patterns:
              - pattern-inside: |
                  let $TRUSTKITCONF = $VALUE as $TY
              - metavariable-regex:
                  metavariable: $TY
                  regex: (?i)^\[\s*String\s*:\s*Any\s*\]$
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)\[([\s\S]*?)(?=kTSKEnforcePinning:\s?false)([\s\S]*?)\]
          - patterns:
              - pattern-inside: |
                  let $TRUSTKITCONF = $VALUE as $TY
              - metavariable-regex:
                  metavariable: $TY
                  regex: (?i)^\[\s*String\s*:\s*Any\s*\]$
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)\[([\s\S]*?)(?=kTSKIncludeSubdomains:\s?false)([\s\S]*?)\]
