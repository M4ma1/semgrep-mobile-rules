rules:
  - id: ios.local.release-pinning-disabled-pbxproj
    languages:
      - generic
    severity: WARNING
    message: >-
      Certificate pinning is disabled in an Xcode Release build configuration. Confirm that the
      production target enables pinning and fails closed.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-295: Improper Certificate Validation'
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/295.html
        - https://mas.owasp.org/MASVS/controls/MASVS-NETWORK-2/
      subcategory:
        - vuln
      technology:
        - ios
        - xcode
    paths:
      include:
        - '*.pbxproj'
    patterns:
      - pattern-inside: |
          Release ... = {
            ...
          };
      - pattern-regex: SSL_PINNING(_ENABLED)?\s*=\s*NO
