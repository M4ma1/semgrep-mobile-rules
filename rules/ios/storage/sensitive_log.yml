rules:
  - id: ios.sensitive_log
    languages:
      - swift
    severity: INFO
    message: >-
      This iOS mobile application seems to be using a logger, which could expose to sensitive
      data. It is recommended to check if the logger is properly configured in the mobile app, to
      not disclose any sensitive data.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code ('Eval Injection')"
      impact: HIGH
      likelihood: HIGH
      references:
        - https://mas.owasp.org/MASTG/tests/ios/MASVS-STORAGE/MASTG-TEST-0053/
        - https://cwe.mitre.org/data/definitions/95.html
        - https://mas.owasp.org/MASVS/controls/MASVS-STORAGE-2/
      subcategory:
        - vuln
      technology:
        - ios
      owasp-mas:
        identifier: MASVS-STORAGE-2
        area: storage
        level:
          - L1
          - L2
    pattern-either:
      - patterns:
          - pattern: os_log("$MESSAGE", ...)
          - metavariable-regex:
              metavariable: $MESSAGE
              regex: .*(%{public}@).*
      - patterns:
          - pattern-inside: |
              let $LOGGER = Logger(...)
              ...
              $LOGGER.$FUNC(...)
          - focus-metavariable: $FUNC
          - metavariable-regex:
              metavariable: $FUNC
              regex: (log|notice|debug|trace|info|error|warning|fault|critical)
