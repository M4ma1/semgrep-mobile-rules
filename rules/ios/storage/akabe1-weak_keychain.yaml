rules:
  - id: ios.akabe1.weak-keychain
    languages:
      - swift
    severity: WARNING
    message: >-
      This iOS mobile application seems configured with a weak Keychain protection, because
      presents the deprecated Keychian attribute "kSecAttrAccessibleAlways" or
      "kSecAttrAccessibleAlwaysThisDeviceOnly". These weak Keychain protection attributes could
      allow an attacker to access the data stored in the corresponding Keychain item, regardless
      of whether the device is locked. It is recommended to use an adequate protection level for
      Keychain data possibly having the "ThisDeviceOnly" suffix, related with the level of
      confidentiality required for the stored data. Note that by default the kSecAttrAccessible
      flag for iOS Keychain is set to "kSecAttrAccessibleWhenUnlocked".
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-922: Insecure Storage of Sensitive Information'
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://mas.owasp.org/MASTG/iOS/0x06d-Testing-Data-Storage/
        - https://developer.apple.com/documentation/security/keychain_services
        - https://support.apple.com/guide/security/keychain-data-protection-secb0694df1a/web
        - https://developer.apple.com/documentation/security/keychain_services/keychain_items/restricting_keychain_item_accessibility
        - https://cwe.mitre.org/data/definitions/922.html
        - https://mas.owasp.org/MASVS/controls/MASVS-STORAGE-1/
      subcategory:
        - vuln
      technology:
        - ios
      authors:
        - Maurizio Siddu
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  $QUERY[kSecAttrAccessible as String] = $KEYCHAINPROTECTION
              - metavariable-regex:
                  metavariable: $KEYCHAINPROTECTION
                  regex: (?i)(kSecAttrAccessibleAlways|kSecAttrAccessibleAlwaysThisDeviceOnly)
          - patterns:
              - pattern-inside: |
                  $QUERY[kSecAttrAccessible] = $KEYCHAINPROTECTION
              - metavariable-regex:
                  metavariable: $KEYCHAINPROTECTION
                  regex: (?i)(kSecAttrAccessibleAlways|kSecAttrAccessibleAlwaysThisDeviceOnly)
          - patterns:
              - pattern-inside: |
                  $QUERY = $VALUE as CFDictionary
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)([\s\S]*?)(?=(kSecAttrAccessibleAlways|kSecAttrAccessibleAlwaysThisDeviceOnly))([\s\S]*?)
          - patterns:
              - pattern-inside: |
                  var $QUERY: [String: Any] = $VALUE
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)\[([\s\S]*?)(?=(kSecAttrAccessibleAlways|kSecAttrAccessibleAlwaysThisDeviceOnly))([\s\S]*?)\]
          - patterns:
              - pattern-inside: |
                  let $QUERY: [String: Any] = $VALUE
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)\[([\s\S]*?)(?=(kSecAttrAccessibleAlways|kSecAttrAccessibleAlwaysThisDeviceOnly))([\s\S]*?)\]
          - patterns:
              - pattern-inside: |
                  var $QUERY: [NSString: Any] = $VALUE
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)\[([\s\S]*?)(?=(kSecAttrAccessibleAlways|kSecAttrAccessibleAlwaysThisDeviceOnly))([\s\S]*?)\]
          - patterns:
              - pattern-inside: |
                  let $QUERY: [NSString: Any] = $VALUE
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)\[([\s\S]*?)(?=(kSecAttrAccessibleAlways|kSecAttrAccessibleAlwaysThisDeviceOnly))([\s\S]*?)\]
