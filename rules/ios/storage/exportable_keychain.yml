rules:
  - id: ios.exportable_keychain
    languages:
      - swift
    severity: INFO
    message: >-
      This iOS mobile application seems to be configured with an exportable Keychain protection,
      which could expose sensitive data. Specifically when the accessibility of the Keychain item
      does not contain the `ThisDeviceOnly` suffix (including `kSecAttrAccessibleAlways`, which
      also lacks the suffix), then the Keychain data could be backed up to iCloud or via iTunes
      even if using unencrypted backups which can be restored to any device.
      It is recommended to use an adequate protection level for Keychain data, possibly having
      the `ThisDeviceOnly` suffix, related with the level of confidentiality required for the
      stored data. Note that by default the `kSecAttrAccessible` flag for Keychain is set to
      `kSecAttrAccessibleWhenUnlocked`.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-922: Insecure Storage of Sensitive Information'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://mas.owasp.org/MASTG/tests/ios/MASVS-STORAGE/MASTG-TEST-0052
        - https://cwe.mitre.org/data/definitions/922.html
        - https://mas.owasp.org/MASVS/controls/MASVS-STORAGE-1/
      subcategory:
        - vuln
      technology:
        - ios
      owasp-mas:
        identifier: MASVS-STORAGE-1
        area: storage
        level:
          - L1
          - L2
      replaces:
        - ios.akabe1.exportable-keychain
    pattern-either:
      - pattern: kSecAttrAccessibleWhenUnlocked
      - pattern: kSecAttrAccessibleAfterFirstUnlock
      - pattern: kSecAttrAccessibleAlways
