rules:
  - id: ios.weak_file_protection
    languages:
      - swift
    severity: WARNING
    message: >-
      This iOS mobile application seems to be using a insufficient data protection class when
      storing some files locally into the device, which could expose sensitive data. This data
      protection configuration could expose the files to undesiderated accesses because the data
      remain accessible under certain circumstances (i.e. jailbroken device). This includes the
      legacy Objective-C-bridged constants `NSFileProtectionNone` and
      `NSDataWritingOptions.dataWritingFileProtectionNone`, which are still valid in Swift and
      equivalent to `FileProtectionType.none` / `Data.WritingOptions.noFileProtection`. It is
      recommended, when possible, to use the maximum data protection level
      `FileProtectionType.complete` or `URLFileProtection.complete`, or the secure write option
      `Data.WritingOptions.completeFileProtection`.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-311: Missing Encryption of Sensitive Data'
        - 'CWE-312: Cleartext Storage of Sensitive Information'
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://mas.owasp.org/MASTG/tests/ios/MASVS-STORAGE/MASTG-TEST-0052/
        - https://cwe.mitre.org/data/definitions/311.html
        - https://cwe.mitre.org/data/definitions/312.html
        - https://mas.owasp.org/MASVS/controls/MASVS-STORAGE-1/
      subcategory:
        - vuln
      technology:
        - ios
      owasp-mas:
        identifier: MASVS-STORAGE-1
        area: storage
        level:
          - L1
          - L2
      replaces:
        - ios.gitlab.rules_lgpl_swift_other_rule-ios-file-no-special
        - ios.akabe1.none-file-protection-part1
        - ios.akabe1.none-file-protection-part2
    pattern-either:
      - pattern: FileProtectionType.none
      - pattern: Data.WritingOptions.noFileProtection
      - pattern: .noFileProtection
      - pattern: URLFileProtection.none
      - pattern: FileProtectionType.completeUnlessOpen
      - pattern: .completeUnlessOpen
      - pattern: Data.WritingOptions.completeFileProtectionUnlessOpen
      - pattern: .completeFileProtectionUnlessOpen
      - pattern: URLFileProtection.completeUnlessOpen
      - pattern: FileProtectionType.completeUntilFirstUserAuthentication
      - pattern: .completeUntilFirstUserAuthentication
      - pattern: Data.WritingOptions.completeFileProtectionUntilFirstUserAuthentication
      - pattern: .completeFileProtectionUntilFirstUserAuthentication
      - pattern: URLFileProtection.completeUntilFirstUserAuthentication
      - pattern: NSFileProtectionNone
      - pattern: .dataWritingFileProtectionNone
      - pattern: Data.WritingOptions.dataWritingFileProtectionNone
      - pattern: NSDataWritingOptions.DataWritingFileProtectionNone
      - pattern: FileProtectionType.DataWritingFileProtectionNone
