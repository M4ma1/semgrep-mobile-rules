rules:
  - id: ios.invalid_logger
    languages:
      - swift
    severity: INFO
    message: >-
      This iOS mobile application seems to be using a logger that does not provide privacy
      configuration, which could expose to sensitive data. It is recommended to use `os_log` (iOS
      10+) or `Logger` (iOS 14+).
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-532: Insertion of Sensitive Information into Log File'
      impact: LOW
      likelihood: LOW
      references:
        - https://mas.owasp.org/MASTG/tests/ios/MASVS-STORAGE/MASTG-TEST-0053/
        - https://cwe.mitre.org/data/definitions/532.html
        - https://mas.owasp.org/MASVS/controls/MASVS-STORAGE-2/
      subcategory:
        - vuln
      technology:
        - ios
      owasp-mas:
        identifier: MASVS-STORAGE-2
        area: storage
        level:
          - L1
          - L2
    pattern-either:
      - pattern: print
      - pattern: NSLog
      - pattern: os_signpost
