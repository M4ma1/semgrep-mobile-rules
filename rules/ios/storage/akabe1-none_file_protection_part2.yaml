rules:
  - id: ios.akabe1.none-file-protection-part2
    languages:
      - swift
    severity: WARNING
    message: >-
      This iOS mobile application seems using a insufficient data protection class when storing
      some files locally into the device. The usage of the data protection class
      "NSFileProtectionNone" or "FileProtectionType.none" means that the file is encrypted using
      a key derived only from the device's UID. The usage of the file write option
      "NSDataWritingOptions.DataWritingFileProtectionNone" instead allows to save unencrypted the
      file into the device. In both cases the file is accessible any time the device is powered
      on, including when locked with a passcode or when booting. This configuration could expose,
      under certain circumstances (i.e. jailbroken device), these files to undesiderated
      accesses. It is suggested to use the data protection class "NSFileProtectionComplete" or
      "FileProtectionType.complete" or the file write option
      "NSDataWritingOptions.DataWritingFileProtectionComplete" when storing files containing
      reserved data.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-311: Missing Encryption of Sensitive Data'
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://mas.owasp.org/MASTG/iOS/0x06d-Testing-Data-Storage/
        - https://developer.apple.com/documentation/foundation/nsfileprotectionnone
        - https://developer.apple.com/documentation/foundation/nsdatawritingoptions/nsdatawritingfileprotectionnone
        - https://cwe.mitre.org/data/definitions/311.html
        - https://mas.owasp.org/MASVS/controls/MASVS-STORAGE-1/
      subcategory:
        - vuln
      technology:
        - ios
      authors:
        - Maurizio Siddu
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  FileManager.default.createFile(..., $VALUE, ...)
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)(.*?)(?=(NSFileProtectionNone|DataWritingFileProtectionNone|FileProtectionType\.none))(.*?)
          - patterns:
              - pattern-inside: |
                  FileManager.default.createFile(..., attributes: $VALUE, ...)
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)\[(.*?)(?=(NSFileProtectionNone|DataWritingFileProtectionNone|FileProtectionType\.none))(.*?)\]
          - patterns:
              - pattern-inside: |
                  FileManager().createFile(..., $VALUE, ...)
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)(.*?)(?=(NSFileProtectionNone|DataWritingFileProtectionNone|FileProtectionType\.none))(.*?)
          - patterns:
              - pattern-inside: |
                  FileManager().createFile(..., attributes: $VALUE, ...)
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)\[(.*?)(?=(NSFileProtectionNone|DataWritingFileProtectionNone|FileProtectionType\.none))(.*?)\]
          - patterns:
              - pattern-inside: |
                  $FM = FileManager()
                  ...
                  $FM.createFile(..., $VALUE, ...)
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)(.*?)(?=(NSFileProtectionNone|DataWritingFileProtectionNone|FileProtectionType\.none))(.*?)
          - patterns:
              - pattern-inside: |
                  $FM = FileManager()
                  ...
                  $FM.createFile(..., attributes: $VALUE, ...)
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)\[(.*?)(?=(NSFileProtectionNone|DataWritingFileProtectionNone|FileProtectionType\.none))(.*?)\]
