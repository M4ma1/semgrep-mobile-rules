rules:
  - id: ios.semgrep.swift-user-defaults
    languages:
      - swift
    severity: WARNING
    message: >-
      Potentially sensitive data was observed to be stored in UserDefaults, which is not adequate
      protection of sensitive information. For data of a sensitive nature, applications should
      leverage the Keychain.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-311: Missing Encryption of Sensitive Data'
      impact: HIGH
      likelihood: LOW
      references:
        - https://developer.apple.com/library/archive/documentation/Security/Conceptual/SecureCodingGuide/Articles/ValidatingInput.html
        - https://mas.owasp.org/MASVS/controls/MASVS-STORAGE-1/
        - https://cwe.mitre.org/data/definitions/311.html
      subcategory:
        - vuln
      technology:
        - ios
        - macos
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A04:2021 - Insecure Design
        - A06:2025 - Insecure Design
      masvs:
        - 'MASVS-STORAGE-1: The app securely stores sensitive data'
    options:
      symbolic_propagation: true
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: |
                      UserDefaults.standard.set("$VALUE", forKey: "$KEY")
                  - pattern: |
                      UserDefaults.standard.set("$VALUE", forKey: $KEY)
                  - pattern: |
                      UserDefaults.standard.set($VALUE, forKey: "$KEY")
                  - pattern: |
                      UserDefaults.standard.set($VALUE, forKey: $KEY)
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i).*(passcode|password|pass_word|passphrase|pass_code|pass_word|pass_phrase)$
              - focus-metavariable: $VALUE
          - patterns:
              - pattern-either:
                  - pattern: |
                      UserDefaults.standard.set("$VALUE", forKey: "$KEY")
                  - pattern: |
                      UserDefaults.standard.set("$VALUE", forKey: $KEY)
                  - pattern: |
                      UserDefaults.standard.set($VALUE, forKey: "$KEY")
                  - pattern: |
                      UserDefaults.standard.set($VALUE, forKey: $KEY)
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i).*(passcode|password|pass_word|passphrase|pass_code|pass_word|pass_phrase)$
              - focus-metavariable: $KEY
          - patterns:
              - pattern-either:
                  - pattern: |
                      UserDefaults.standard.set("$VALUE", forKey: "$KEY")
                  - pattern: |
                      UserDefaults.standard.set("$VALUE", forKey: $KEY)
                  - pattern: |
                      UserDefaults.standard.set($VALUE, forKey: "$KEY")
                  - pattern: |
                      UserDefaults.standard.set($VALUE, forKey: $KEY)
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i).*(api_key|apikey)$
              - focus-metavariable: $VALUE
          - patterns:
              - pattern-either:
                  - pattern: |
                      UserDefaults.standard.set("$VALUE", forKey: "$KEY")
                  - pattern: |
                      UserDefaults.standard.set("$VALUE", forKey: $KEY)
                  - pattern: |
                      UserDefaults.standard.set($VALUE, forKey: "$KEY")
                  - pattern: |
                      UserDefaults.standard.set($VALUE, forKey: $KEY)
              - metavariable-regex:
                  metavariable: $KEY
                  regex: (?i).*(api_key|apikey)$
              - focus-metavariable: $KEY
          - patterns:
              - pattern-either:
                  - pattern: |
