rules:
  - id: ios.akabe1.weak-file-protection-part2
    languages:
      - swift
    severity: WARNING
    message: >-
      This iOS mobile application seems using a weak data protection class when storing some
      files locally into the device, this configuration could expose the files to undesiderated
      accesses because the data remain accessible under certain circumstances (i.e. jailbroken
      device). In particular, the FileProtectionType weak classes that should be used carefully
      are: - "NSFileProtectionCompleteUnlessOpen" - "FileProtectionType.completeUnlessOpen" -
      "NSFileProtectionCompleteUntilFirstUserAuthentication" (default value on iOS) -
      "FileProtectionType.completeUntilFirstUserAuthentication" and the weak file write options
      are: - "DataWritingFileProtectionCompleteUnlessOpen" -
      "DataWritingFileProtectionCompleteUntilFirstUserAuthentication" When saving reserved data
      in local files it is suggested to use any of the secure data protection classes
      "NSFileProtectionComplete" and "FileProtectionType.complete", or the secure file write
      option "NSDataWritingOptions.DataWritingFileProtectionComplete".
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-311: Missing Encryption of Sensitive Data'
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://mas.owasp.org/MASTG/iOS/0x06d-Testing-Data-Storage/
        - https://developer.apple.com/documentation/foundation/nsfileprotectioncompleteunlessopen
        - https://developer.apple.com/documentation/foundation/nsfileprotectioncompleteuntilfirstuserauthentication
        - https://developer.apple.com/documentation/uikit/protecting_the_user_s_privacy/encrypting_your_app_s_files
        - https://cwe.mitre.org/data/definitions/311.html
        - https://mas.owasp.org/MASVS/controls/MASVS-STORAGE-1/
      subcategory:
        - vuln
      technology:
        - ios
      authors:
        - Maurizio Siddu
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  FileManager.default.createFile(..., $VALUE, ...)
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)(.*?)(?=(NSFileProtectionCompleteUnlessOpen|DataWritingFileProtectionCompleteUnlessOpen|FileProtectionType\.completeUnlessOpen|NSFileProtectionCompleteUntilFirstUserAuthentication|DataWritingFileProtectionCompleteUntilFirstUserAuthentication|FileProtectionType\.completeUntilFirstUserAuthentication))(.*?)
          - patterns:
              - pattern-inside: |
                  FileManager.default.createFile(..., attributes: $VALUE, ...)
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)\[(.*?)(?=(NSFileProtectionCompleteUnlessOpen|DataWritingFileProtectionCompleteUnlessOpen|FileProtectionType\.completeUnlessOpen|NSFileProtectionCompleteUntilFirstUserAuthentication|DataWritingFileProtectionCompleteUntilFirstUserAuthentication|FileProtectionType\.completeUntilFirstUserAuthentication))(.*?)\]
          - patterns:
              - pattern-inside: |
                  FileManager().createFile(..., $VALUE, ...)
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)(.*?)(?=(NSFileProtectionCompleteUnlessOpen|DataWritingFileProtectionCompleteUnlessOpen|FileProtectionType\.completeUnlessOpen|NSFileProtectionCompleteUntilFirstUserAuthentication|DataWritingFileProtectionCompleteUntilFirstUserAuthentication|FileProtectionType\.completeUntilFirstUserAuthentication))(.*?)
          - patterns:
              - pattern-inside: |
                  FileManager().createFile(..., attributes: $VALUE, ...)
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)\[(.*?)(?=(NSFileProtectionCompleteUnlessOpen|DataWritingFileProtectionCompleteUnlessOpen|FileProtectionType\.completeUnlessOpen|NSFileProtectionCompleteUntilFirstUserAuthentication|DataWritingFileProtectionCompleteUntilFirstUserAuthentication|FileProtectionType\.completeUntilFirstUserAuthentication))(.*?)\]
          - patterns:
              - pattern-inside: |
                  $FM = FileManager()
                  ...
                  $FM.createFile(..., $VALUE, ...)
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)(.*?)(?=(NSFileProtectionCompleteUnlessOpen|DataWritingFileProtectionCompleteUnlessOpen|FileProtectionType\.completeUnlessOpen|NSFileProtectionCompleteUntilFirstUserAuthentication|DataWritingFileProtectionCompleteUntilFirstUserAuthentication|FileProtectionType\.completeUntilFirstUserAuthentication))(.*?)
          - patterns:
              - pattern-inside: |
                  $FM = FileManager()
                  ...
                  $FM.createFile(..., attributes: $VALUE, ...)
              - metavariable-regex:
                  metavariable: $VALUE
                  regex: (?i)\[(.*?)(?=(NSFileProtectionCompleteUnlessOpen|DataWritingFileProtectionCompleteUnlessOpen|FileProtectionType\.completeUnlessOpen|NSFileProtectionCompleteUntilFirstUserAuthentication|DataWritingFileProtectionCompleteUntilFirstUserAuthentication|FileProtectionType\.completeUntilFirstUserAuthentication))(.*?)\]
