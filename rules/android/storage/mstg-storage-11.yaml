rules:
  - id: MSTG-STORAGE-11
    languages:
      - xml
    severity: WARNING
    message: The application allows to use Android versions earlier than 23.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-1104: Use of Unmaintained Third Party Components'
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05d-Testing-Data-Storage.md#testing-the-device-access-security-policy-mstg-storage-11
        - https://cwe.mitre.org/data/definitions/1104.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: M1
      area: storage
      verification-level:
        - L2
      authors:
        - Riccardo Cardelli @gand3lf (IMQ Minded Security)
      replaces:
        - android.owasp.minsdkversion
    patterns:
      - pattern: <uses-sdk android:minSdkVersion="$X" />
      - metavariable-comparison:
          comparison: int($X)<23
