rules:
  - id: android.mobsf.hardcoded_password
    languages:
      - java
    severity: WARNING
    message: A hardcoded password in plain text is identified.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-798: Use of Hard-coded Credentials'
      impact: HIGH
      likelihood: MEDIUM
      references:
        - https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05d-Testing-Data-Storage.md#storing-a-key---example
        - https://cwe.mitre.org/data/definitions/798.html
        - https://mas.owasp.org/MASVS/controls/MASVS-STORAGE-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: m9
      masvs: storage-14
    patterns:
      - pattern-not: $X = "";
      - pattern-not: $M($X, "", ...);
      - pattern-either:
          - pattern: |
              $X = "...";
          - pattern: |
              $M($X, "...", ...);
      - metavariable-regex:
          metavariable: $X
          regex: (?i:^.{0,100}pass.{0,100})

