rules:
  - id: android.owasp.backup-manifest-backup-rules
    languages:
      - xml
    severity: WARNING
    message: '[MASVS-STORAGE-2] Backup rules detected.'
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-530: Exposure of Backup File to an Unauthorized Control Sphere'
      impact: LOW
      likelihood: LOW
      references:
        - https://developer.android.com/guide/topics/data/autobackup
        - https://cwe.mitre.org/data/definitions/530.html
        - https://mas.owasp.org/MASVS/controls/MASVS-STORAGE-2/
      subcategory:
        - vuln
      technology:
        - android
      summary: This rule inspects the AndroidManifest.xml for backup rules.
    pattern-either:
      - pattern: android:fullBackupContent="@xml/backup_rules"
      - pattern: android:dataExtractionRules="@xml/data_extraction_rules"
