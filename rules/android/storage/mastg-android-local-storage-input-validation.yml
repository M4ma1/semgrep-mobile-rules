rules:
  - id: android.owasp.local-storage-input-validation
    languages:
      - java
    severity: WARNING
    message: >-
      [MASVS-CODE-4] SharedPreferences value loaded. Review whether integrity and authenticity
      are validated before the value is trusted.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-20: Improper Input Validation'
      impact: LOW
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/20.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
      summary: SharedPreferences read that requires manual review.
    pattern-either:
      - patterns:
          - pattern-inside: |
              ...
              private final String loadPlain(...) {
                ...
              }
          - pattern-either:
              - pattern: prefs().getString(...)
              - pattern: prefs().getStringSet(...)
              - pattern: prefs().getInt(...)
              - pattern: prefs().getLong(...)
              - pattern: prefs().getFloat(...)
              - pattern: prefs().getBoolean(...)
      - patterns:
          - pattern-inside: |
              ...
              private final String loadProtected(...) {
                ...
              }
          - pattern-either:
              - pattern: prefs().getString(...)
              - pattern: prefs().getStringSet(...)
              - pattern: prefs().getInt(...)
              - pattern: prefs().getLong(...)
              - pattern: prefs().getFloat(...)
              - pattern: prefs().getBoolean(...)

  - id: android.owasp.hmac-validation-present
    languages:
      - java
    severity: INFO
    message: >-
      [MASVS-CODE-4] HMAC or MAC related integrity logic detected. Review whether it protects the
      reported local storage read and whether the secret is attacker accessible.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-353: Missing Support for Integrity Check'
      impact: LOW
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/353.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
      summary: HMAC or MAC based integrity logic present near local storage handling.
    pattern-either:
      - pattern: Mac.getInstance(...)
      - pattern: new SecretKeySpec(...)
      - pattern: $MAC.init(...)
      - pattern: $MAC.doFinal(...)
