# yamllint enable
rules:
  - id: android.gitlab.kotlin_file_rule-FileUploadFileName
    languages:
      - kotlin
    severity: ERROR
    message: >-
      The filename provided by the FileUpload API can be tampered with by the client to reference
      unauthorized files. The provided filename should be properly validated to ensure it's
      properly structured, contains no unauthorized path characters (e.g., / \), and refers to an
      authorized file.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/22.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
        - kotlin
      owasp:
        - A1:2017-Injection
        - A03:2021-Injection
      security-severity: CRITICAL
      shortDescription: Improper limitation of a pathname to a restricted directory ('Path Traversal')
    pattern-either:
      - patterns:
          - pattern-inside: |
              $FILES = ($SFU: ServletFileUpload).parseRequest(($REQ: $X.servlet.http.HttpServletRequest?))
              ...
              for($ITEM in $FILES) {
                ...
              }
          - pattern: $ITEM.getName()
      - pattern: '($PART: $X.servlet.http.Part).getSubmittedFileName()'
