rules:
  - id: MSTG-STORAGE-7_1
    languages:
      - java
    severity: WARNING
    message: The application exposes sensitive data via the user interface.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-200: Exposure of Sensitive Information to an Unauthorized Actor'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05d-Testing-Data-Storage.md#checking-for-sensitive-data-disclosure-through-the-user-interface-mstg-storage-7
        - https://cwe.mitre.org/data/definitions/200.html
        - https://mas.owasp.org/MASVS/controls/MASVS-STORAGE-2/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: M2
      area: storage
      verification-level:
        - L1
        - L2
      authors:
        - Riccardo Granata (IMQ Minded Security)
        - Andrea Agnello (IMQ Minded Security)
      replaces:
        - android.owasp.sensitive-data-in-notifications
    pattern-either:
      - patterns:
          - pattern: $X.setContentTitle($V)
          - metavariable-regex:
              metavariable: $V
              regex: .*(?i)(key|pin|secret|password|pwd|passwd|token).*
      - patterns:
          - pattern: $X.setContentText($V)
          - metavariable-regex:
              metavariable: $V
              regex: .*(?i)(key|pin|secret|password|pwd|passwd|token).*
