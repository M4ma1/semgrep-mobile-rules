rules:
  - id: MSTG-CODE-8_2
    languages:
      - java
    severity: WARNING
    message: >-
      The application defines the attribute "$V" statically preventing the garbage collector from
      cleaning the memory.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-401: Missing Release of Memory after Effective Lifetime'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05i-Testing-Code-Quality-and-Build-Settings.md#memory-corruption-bugs-mstg-code-8
        - https://cwe.mitre.org/data/definitions/401.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: M7
      area: code
      verification-level:
        - L2
      authors:
        - Riccardo Cardelli @gand3lf (IMQ Minded Security)
    patterns:
      - pattern-not-inside: $M(...){...}
      - pattern: static $T $V;
      - metavariable-regex:
          metavariable: $T
          regex: .*(View|Activity|Context).*
