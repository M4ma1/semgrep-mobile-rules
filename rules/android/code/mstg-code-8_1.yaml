rules:
  - id: MSTG-CODE-8_1
    languages:
      - java
    severity: WARNING
    message: >-
      The application does not unregister the broadcast receiver "$RCV" in the "onStop()" method
      of the activity.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-401: Missing Release of Memory after Effective Lifetime'
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05i-Testing-Code-Quality-and-Build-Settings.md#memory-corruption-bugs-mstg-code-8
        - https://cwe.mitre.org/data/definitions/401.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: M7
      area: code
      verification-level:
        - L2
      authors:
        - Riccardo Cardelli @gand3lf (IMQ Minded Security)
    options:
      symbolic_propagation: true
    patterns:
      - pattern: |
          public class $CLASS{
            ...
            $M(...){
              ...
              registerReceiver($RCV, ...);
              ...
            }
          }
      - pattern-not: |
          public class $CLASS{
            ...
            onStop(...){
              ...
              unregisterReceiver(...);
              ...
            }
          }
      - focus-metavariable:
          - $RCV
