rules:
  - id: android.local.release-security-feature-disabled
    languages:
      - generic
    severity: WARNING
    message: >-
      A security feature is disabled in the release Gradle configuration. Confirm that screen
      protection, root detection, and certificate pinning remain enabled in production builds.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-693: Protection Mechanism Failure'
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/693.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-2/
      subcategory:
        - vuln
      technology:
        - android
        - gradle
    paths:
      include:
        - '*build.gradle'
        - '*build.gradle.kts'
    patterns:
      - pattern-inside: |
          release {
            ...
          }
      - pattern-regex: (?i)(FLAG_SECURE|CHECK_ROOT|SSL_PINNING)[^\n]{0,40}false
