rules:
  - id: MSTG-CODE-8_3
    languages:
      - java
    severity: WARNING
    message: The application uses dangerously inner classes that are prone to memory leak.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-401: Missing Release of Memory after Effective Lifetime'
      impact: LOW
      likelihood: LOW
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05i-Testing-Code-Quality-and-Build-Settings.md#memory-corruption-bugs-mstg-code-8
        - https://cwe.mitre.org/data/definitions/401.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: M7
      area: code
      verification-level:
        - L2
      authors:
        - Riccardo Cardelli @gand3lf (IMQ Minded Security)
    pattern-either:
      # Removed for performance reasons
      #      - patterns:
      #          - pattern: |
      #              class $C{
      #                static $INNER $X;
      #                ...
      #                $M(...){
      #                  ...
      #                  $X = new $INNER(...);
      #                  ...
      #                }
      #                ...
      #                class $INNER{...}
      #                ...
      #              }
      #          - focus-metavariable:
      #              - $INNER
      - patterns:
          - pattern: |
              class $C{
                ...
                class $INNER{
                  ...
                  $F(...,$A $P, ...){...}
                  ...
                }
                ...
              }
          - metavariable-regex:
              metavariable: $A
              regex: .*Activity
          - focus-metavariable:
              - $INNER
