rules:
  - id: android.semgrep.build-gradle-password-hardcoded
    languages:
      - kotlin
    severity: WARNING
    message: >-
      A secret is hard-coded in the application. Secrets stored in source code, such as
      credentials, identifiers, and other types of sensitive data, can be leaked and used by
      internal or external malicious actors. It is recommended to rotate the secret and retrieve
      them from a secure secret vault or Hardware Security Module (HSM), alternatively
      environment variables can be used if allowed by your company policy.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-798: Use of Hard-coded Credentials'
      impact: HIGH
      likelihood: LOW
      references:
        - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures
        - https://semgrep.dev/playground/r/d8Ur5BA/achufistov6_personal_org.build-gradle-password-hardcoded
        - https://cwe.mitre.org/data/definitions/798.html
        - https://mas.owasp.org/MASVS/controls/MASVS-STORAGE-1/
      subcategory:
        - vuln
      technology:
        - android
        - secrets
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      cwe2020-top25: true
      cwe2021-top25: true
      cwe2022-top25: true
      vulnerability_class:
        - Hard-coded Secrets
    options:
      symbolic_propagation: true
    paths:
      include:
        - '*build.gradle.kts'
    patterns:
      - pattern-either:
          - pattern: '$PASS = env[...] ?: $VALUE'
      - metavariable-regex:
          metavariable: $PASS
          regex: (password|pass|passwd|loginPassword)
      - metavariable-pattern:
          language: generic
          metavariable: $VALUE
          patterns:
            - pattern-either:
                - pattern-regex: ^[A-Za-z0-9/+=]+$
