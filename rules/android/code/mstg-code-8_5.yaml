rules:
  - id: MSTG-CODE-8_5
    languages:
      - java
    severity: WARNING
    message: The application uses non-static anonymous class "$IC" causing possible memory leaks.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-401: Missing Release of Memory after Effective Lifetime'
      impact: LOW
      likelihood: LOW
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05i-Testing-Code-Quality-and-Build-Settings.md#memory-corruption-bugs-mstg-code-8
        - https://cwe.mitre.org/data/definitions/401.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: M7
      area: code
      verification-level:
        - L2
      authors:
        - Riccardo Cardelli @gand3lf (IMQ Minded Security)
    options:
      symbolic_propagation: true
    patterns:
      - pattern: |
          class $C{
            ...
            class $IC extends Thread{
              ...
            }
          }
      - pattern-not: |
          class $C{
            ...
            static class $IC extends Thread{
              ...
            }
          }
      - focus-metavariable:
          - $IC
