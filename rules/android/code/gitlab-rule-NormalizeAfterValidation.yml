# yamllint enable
rules:
  - id: android.gitlab.kotlin_strings_rule-NormalizeAfterValidation
    languages:
      - kotlin
    severity: WARNING
    message: IDS01-J. Normalize strings before validating them
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-180: Incorrect Behavior Order: Validate Before Canonicalize'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/180.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
      owasp:
        - A1:2017-Injection
        - A03:2021-Injection
      security-severity: MEDIUM
      shortDescription: 'Incorrect behavior order: validate before canonicalize'
    patterns:
      - pattern: |-
          $Y = java.util.regex.Pattern.compile("[<>]");
          ...
          $Y.matcher($VAR);
          ...
          java.text.Normalizer.normalize($VAR, ...);
