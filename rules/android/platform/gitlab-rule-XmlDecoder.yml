# yamllint enable
rules:
  - id: android.gitlab.kotlin_xml_rule-XmlDecoder
    languages:
      - kotlin
    severity: WARNING
    message: Avoid using XMLDecoder to parse content from an untrusted source.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-502: Deserialization of Untrusted Data'
      impact: HIGH
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/502.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
      owasp:
        - A8:2017-Insecure Deserialization
        - A08:2021-Software and Data Integrity Failures
      security-severity: MEDIUM
      shortDescription: Deserialization of untrusted data
    patterns:
      - pattern-either:
          - pattern: '($D: java.beans.XMLDecoder).readObject()'
          - patterns:
              - pattern: $D.readObject()
              - pattern-inside: |
                  $D = XMLDecoder(...)
                  ...
      - pattern-not:
          pattern-either:
            - patterns:
                - pattern-inside: |
                    $DEC = java.beans.XMLDecoder(..., $CL)
                    ...
                - pattern: $DEC.readObject()
                - metavariable-pattern:
                    metavariable: $CL
                    patterns:
                      - pattern: |
                          object : ClassLoader() {
                            ...
                            fun loadClass(name: String, resolve: Boolean): $RET {
                              if($X){
                                throw ...
                              }
                              ...
                            }
                            ...
                          }
                      - metavariable-pattern:
                          metavariable: $X
                          pattern-either:
                            - pattern: |
                                name != ...
                            - pattern: |
                                !$LIST.contains(name)
            - patterns:
                - pattern-inside: |
                    $CLASS_LOADER  = $CL
                    ...
                - pattern-inside: |
                    $DEC = java.beans.XMLDecoder(..., $CLASS_LOADER)
                    ...
                - pattern: $DEC.readObject()
                - metavariable-pattern:
                    metavariable: $CL
                    patterns:
                      - pattern: |
                          object : ClassLoader(){
                            ...
                            fun loadClass(name: String, resolve: Boolean): $RET{
                              if($X){
                                throw ...
                              }
                              ...
                            }
                            ...
                          }
                      - metavariable-pattern:
                          metavariable: $X
                          pattern-either:
                            - pattern: |
                                name != ...
                            - pattern: |
                                !$LIST.contains(name)
