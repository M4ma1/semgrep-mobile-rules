rules:
  - id: MSTG-PLATFORM-6_2
    severity: WARNING
    languages:
      - java
      - kotlin
    metadata:
      authors:
        - Federico Dotta @apps3c (HN Security)
      owasp-mobile: M1
      category: security
      area: platform
      verification-level:
        - L1
        - L2
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05h-Testing-Platform-Interaction.md#testing-webview-protocol-handlers-mstg-platform-6
      confidence: LOW
      likelihood: LOW
      impact: LOW
      technology: [android]
      replaces:
        - android.mobsf.webview_allow_file_from_url
        - android.mobsf.webview_set_allow_file_access
        - android.owasp.webview-settings
    message: >-
        The WebView allows to load external content. It is suggested to verify that the granted
        accesses are necessary and follow the best practices. Enabling file access from URLs in a
        WebView can leak sensitive information from the file system.
    options:
      symbolic_propagation: true
    patterns:
      - pattern-either:
          # Setter calls: settings.setAllowFileAccess(true), setAllowFileAccess(x), ...
          - pattern: $A.setAllowContentAccess(...)
          - pattern: setAllowContentAccess(...)
          - pattern: $A.setAllowFileAccess(...)
          - pattern: setAllowFileAccess(...)
          - pattern: $A.setAllowFileAccessFromFileURLs(...)
          - pattern: setAllowFileAccessFromFileURLs(...)
          - pattern: $A.setAllowUniversalAccessFromFileURLs(...)
          - pattern: setAllowUniversalAccessFromFileURLs(...)
          # Kotlin property syntax: settings.allowFileAccess = true / apply { allowFileAccess = x }
          - pattern: $A.allowContentAccess = $V
          - pattern: allowContentAccess = $V
          - pattern: $A.allowFileAccess = $V
          - pattern: allowFileAccess = $V
          - pattern: $A.allowFileAccessFromFileURLs = $V
          - pattern: allowFileAccessFromFileURLs = $V
          - pattern: $A.allowUniversalAccessFromFileURLs = $V
          - pattern: allowUniversalAccessFromFileURLs = $V
      - pattern-not: $A.setAllowContentAccess(false)
      - pattern-not: setAllowContentAccess(false)
      - pattern-not: $A.setAllowFileAccess(false)
      - pattern-not: setAllowFileAccess(false)
      - pattern-not: $A.setAllowFileAccessFromFileURLs(false)
      - pattern-not: setAllowFileAccessFromFileURLs(false)
      - pattern-not: $A.setAllowUniversalAccessFromFileURLs(false)
      - pattern-not: setAllowUniversalAccessFromFileURLs(false)
      - pattern-not: $A.allowContentAccess = false
      - pattern-not: allowContentAccess = false
      - pattern-not: $A.allowFileAccess = false
      - pattern-not: allowFileAccess = false
      - pattern-not: $A.allowFileAccessFromFileURLs = false
      - pattern-not: allowFileAccessFromFileURLs = false
      - pattern-not: $A.allowUniversalAccessFromFileURLs = false
      - pattern-not: allowUniversalAccessFromFileURLs = false
