# yamllint enable
rules:
  - id: android.gitlab.kotlin_csrf_rule-SpringCSRFDisabled
    languages:
      - kotlin
    severity: WARNING
    message: >-
      The application fails to protect against Cross-Site Request Forgery (CSRF) due to disabling
      Spring's CSRF protection features.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-352: Cross-Site Request Forgery (CSRF)'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/352.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp:
        - A5:2017-Broken Access Control
        - A01:2021-Broken Access Control
      security-severity: MEDIUM
      shortDescription: Cross-Site Request Forgery (CSRF)
    pattern-either:
      - pattern: '($H: org.springframework.security.config.annotation.web.builders.HttpSecurity). ... .csrf().disable()'
      # - pattern: "($C: org.springframework.security.config.annotation.web.configurers.CsrfConfigurer<HttpSecurity>).disable()"
      - pattern: '($C: CsrfConfigurer<HttpSecurity>).disable()'
