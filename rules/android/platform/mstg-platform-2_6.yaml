rules:
  - id: MSTG-PLATFORM-2_6
    languages:
      - java
    severity: WARNING
    message: Potential Fragment Injection found in the dinamically instantiated Fragment.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - "CWE-470: Use of Externally-Controlled Input to Select Classes or Code ('Unsafe Reflection')"
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05h-Testing-Platform-Interaction.md#testing-for-fragment-injection-mstg-platform-2
        - https://cwe.mitre.org/data/definitions/470.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: M7
      area: platform
      verification-level:
        - L1
        - L2
      authors:
        - Riccardo Cardelli @gand3lf (IMQ Minded Security)
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: class $CLASS extends FragmentActivity { ... }
          - pattern-either:
              - pattern: '... .getIntent().$GETMETHOD(...)'
              - pattern: getIntent().$GETMETHOD(...)
          - metavariable-regex:
              metavariable: $GETMETHOD
              regex: get.*
    pattern-sinks:
      - pattern: Fragment.instantiate(...)
