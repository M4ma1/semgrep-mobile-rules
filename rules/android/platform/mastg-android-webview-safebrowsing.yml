rules:
  - id: android.owasp.webview-safebrowsing-disabled-manifest
    languages:
      - xml
    severity: WARNING
    message: >-
      [MASVS-CODE-4] SafeBrowsing is disabled for WebViews in the AndroidManifest
      (EnableSafeBrowsing set to false). This removes an important security protection against
      known malicious URLs.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/79.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-2/
      subcategory:
        - vuln
      technology:
        - android
      summary: This rule detects when SafeBrowsing is explicitly disabled for WebViews in the AndroidManifest.xml.
    patterns:
      - pattern: |
          <meta-data android:name="android.webkit.WebView.EnableSafeBrowsing" android:value="false" ... />

  - id: android.owasp.webview-safebrowsing-disabled-code
    languages:
      - java
    severity: WARNING
    message: >-
      [MASVS-CODE-4] SafeBrowsing is disabled for WebViews in code via
      setSafeBrowsingEnabled(false). This takes precedence over the AndroidManifest and removes
      an important security protection against known malicious URLs.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/79.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-2/
      subcategory:
        - vuln
      technology:
        - android
      summary: This rule detects when SafeBrowsing is explicitly disabled for WebViews at runtime via WebSettings.setSafeBrowsingEnabled(false).
    pattern: $WEBSETTINGS.setSafeBrowsingEnabled(false)
