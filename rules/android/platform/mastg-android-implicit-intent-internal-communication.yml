rules:
  - id: android.owasp.implicit-intent-internal-communication
    languages:
      - java
    severity: WARNING
    message: >-
      [MASVS-CODE-4] The app uses an implicit intent for internal component communication. Use
      explicit intents by specifying the package or component.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-927: Use of Implicit Intent for Sensitive Communication'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/927.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-1/
      subcategory:
        - vuln
      technology:
        - android
      summary: Detects implicit intents used for internal component communication without specifying a package or component.
    patterns:
      - pattern: |
          $INTENT = new Intent(...);
          ...
          $INTENT.setAction($ACTION);
          ...
          $CONTEXT.startActivity($INTENT);
      - pattern-not: |
          $INTENT = new Intent(...);
          ...
          $INTENT.setPackage(...);
          ...
          $CONTEXT.startActivity($INTENT);
      - pattern-not: |
          $INTENT = new Intent(...);
          ...
          $INTENT.setComponent(...);
          ...
          $CONTEXT.startActivity($INTENT);
      - pattern-not: |
          $INTENT = new Intent($CONTEXT, $CLASS);
          ...
          $CONTEXT.startActivity($INTENT);
