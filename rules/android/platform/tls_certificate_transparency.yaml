rules:
  - id: android.mobsf.android_certificate_transparency
    languages:
      - java
    severity: INFO
    message: >-
      This app does not enforce TLS Certificate Transparency that helps to detect SSL
      certificates that have been mistakenly issued by a certificate authority or maliciously
      acquired from an otherwise unimpeachable certificate authority.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-295: Improper Certificate Validation'
      impact: LOW
      likelihood: LOW
      references:
        - https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05g-Testing-Network-Communication.md#testing-custom-certificate-stores-and-certificate-pinning-mstg-network-4
        - https://cwe.mitre.org/data/definitions/295.html
        - https://mas.owasp.org/MASVS/controls/MASVS-NETWORK-2/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: m3
      masvs: network-4
    patterns:
      - pattern-either:
          - pattern: |
              import com.babylon.certificatetransparency;
          - pattern: |
              new CTInterceptorBuilder(...)
          - pattern: |
              new CTHostnameVerifierBuilder(...)
