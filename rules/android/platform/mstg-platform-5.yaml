rules:
  - id: MSTG-PLATFORM-5
    languages:
      - java
      - kotlin
    severity: WARNING
    message: The application allows for JavaScript execution within a WebView instance.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05h-Testing-Platform-Interaction.md#testing-javascript-execution-in-webviews-mstg-platform-5
        - https://cwe.mitre.org/data/definitions/79.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-2/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: M1
      area: platform
      verification-level:
        - L1
        - L2
      authors:
        - Christian Cotignola @b4dsheep (IMQ Minded Security)
      replaces:
        - android.insecure_javascript_execution
        - android.federicodotta.android-webview-kotlin-apps3c
        - android.federicodotta.android-apps3c
    pattern-either:
      - pattern: $OBJ.setJavaScriptEnabled(true)
      - pattern: setJavaScriptEnabled(true)
      - pattern: $OBJ.javaScriptEnabled = true
      - pattern: javaScriptEnabled = true
