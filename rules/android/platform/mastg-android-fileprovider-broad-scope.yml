rules:
  - id: android.owasp.fileprovider-broad-path-scope
    languages:
      - xml
    severity: WARNING
    message: >-
      [MASVS-PLATFORM] FileProvider path element is declared with path=".", which maps the entire
      corresponding base directory into the provider's addressable namespace. Any file under that
      directory becomes reachable through FileProvider.getUriForFile(), including secrets or
      files added later. Narrow the path to a specific subdirectory containing only files
      intended for sharing (e.g. path="reports/").
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-552: Files or Directories Accessible to External Parties'
      impact: HIGH
      likelihood: LOW
      references:
        - https://developer.android.com/reference/androidx/core/content/FileProvider#specifying-available-files
        - https://cwe.mitre.org/data/definitions/552.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-1/
      subcategory:
        - vuln
      technology:
        - android
      masvs:
        - MASVS-PLATFORM
      summary: Detects FileProvider path elements declared with an overly broad scope (path=".").
    pattern-either:
      - pattern: |
          <files-path ... path="." ... />
      - pattern: |
          <cache-path ... path="." ... />
      - pattern: |
          <external-path ... path="." ... />
      - pattern: |
          <external-files-path ... path="." ... />
      - pattern: |
          <external-cache-path ... path="." ... />

  - id: android.owasp.fileprovider-root-path
    languages:
      - xml
    severity: WARNING
    message: >-
      [MASVS-PLATFORM] FileProvider declares <root-path>, which maps the provider root to the
      device root filesystem ("/"). This scope is far too broad for secure file sharing and
      should be replaced with a narrower path element such as <files-path> or <cache-path> scoped
      to a specific subdirectory.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-552: Files or Directories Accessible to External Parties'
      impact: HIGH
      likelihood: LOW
      references:
        - https://developer.android.com/reference/androidx/core/content/FileProvider#specifying-available-files
        - https://cwe.mitre.org/data/definitions/552.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-1/
      subcategory:
        - vuln
      technology:
        - android
      masvs:
        - MASVS-PLATFORM
      summary: Detects use of <root-path> in FileProvider configuration.
    pattern: |
      <root-path ... />
