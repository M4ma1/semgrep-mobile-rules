# https://github.com/returntocorp/semgrep-rules/blob/develop/java/lang/security/xmlinputfactory-possible-xxe.yaml
# https://github.com/returntocorp/semgrep-rules/blob/develop/java/lang/security/xmlinputfactory-external-entities-enabled.yaml
rules:
  - id: android.mobsf.xmlinputfactory_xxe
    message: >
      XML external entities are not explicitly disabled, or are explicitly
      enabled, for this XMLInputFactory. This could be vulnerable to XML
      external entity vulnerabilities. Explicitly disable external entities by
      setting "javax.xml.stream.isSupportingExternalEntities" to false.
    severity: ERROR
    languages:
      - java
    metadata:
      cwe: cwe-611
      owasp-mobile: m8
      masvs: platform-2
      reference: >-
        https://github.com/MobSF/owasp-mstg/blob/master/Document/0x04h-Testing-Code-Quality.md#injection-flaws-mstg-arch-2-and-mstg-platform-2
      replaces:
        - android.mobsf.xmlinputfactory_xxe_enabled
    pattern-either:
      # Factory created without explicitly disabling external entities
      - patterns:
          - pattern-not-inside: |
              $RETURNTYPE $METHOD(...) {
                ...
                $XMLFACTORY.setProperty("javax.xml.stream.isSupportingExternalEntities", false);
                ...
              }
          - pattern-not-inside: |
              $RETURNTYPE $METHOD(...) {
                ...
                $XMLFACTORY.setProperty(java.xml.stream.XMLFactoryInput.IS_SUPPORTING_EXTERNAL_ENTITIES, false);
                ...
              }
          - pattern-either:
              - pattern: $XMLFACTORY = $W.newFactory(...);
              - pattern: $XMLFACTORY = new XMLInputFactory(...);
      # External entities explicitly enabled
      - pattern: >-
          $XMLFACTORY.setProperty("javax.xml.stream.isSupportingExternalEntities",
          true);
