rules:
  - id: android.owasp.flag-secure-enable-flags
    languages:
      - java
    severity: INFO
    message: '[MASVS-PLATFORM] Make sure you use this flag for all screens with sensitive data'
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-200: Exposure of Sensitive Information to an Unauthorized Actor'
      impact: LOW
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/200.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-3/
      subcategory:
        - vuln
      technology:
        - android
      summary: Window uses FLAG_SECURE to block screenshots.
    pattern-either:
      - patterns:
          - pattern: $W.addFlags($F)
          - metavariable-regex:
              metavariable: $F
              regex: ^(FLAG_SECURE|8192|0x2000)$
      - patterns:
          - pattern: $W.setFlags($FLAGS, $FLAGS)
          - metavariable-regex:
              metavariable: $FLAGS
              regex: ^(FLAG_SECURE|8192|0x2000)$
