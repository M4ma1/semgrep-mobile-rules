rules:
  - id: android.semgrep.manifest-usesCleartextTraffic-true
    languages:
      - generic
    severity: INFO
    message: >-
      The Android manifest is configured to allow non-encrypted connections. Evaluate if this is
      necessary for your app, and disable it if appropriate. This flag is ignored on Android 7
      (API 24) and above if a Network Security Config is present.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-319: Cleartext Transmission of Sensitive Information'
      impact: HIGH
      likelihood: MEDIUM
      references:
        - https://developer.android.com/guide/topics/manifest/application-element#usesCleartextTraffic
        - https://developer.android.com/training/articles/security-config
        - https://cwe.mitre.org/data/definitions/319.html
        - https://mas.owasp.org/MASVS/controls/MASVS-NETWORK-1/
      subcategory:
        - vuln
      technology:
        - android
    paths:
      include:
        - '*.xml'
    patterns:
      - pattern: |
          android:usesCleartextTraffic="true"
      - pattern-not-inside: |
          <!-- ... -->

  - id: android.semgrep.manifest-usesCleartextTraffic-ignored-by-nsc
    languages:
      - generic
    severity: INFO
    message: >-
      Manifest uses both `android:usesCleartextTraffic` and Network Security Config. The
      `usesCleartextTraffic` directive is ignored on Android 7 (API 24) and above if a Network
      Security Config is present.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-319: Cleartext Transmission of Sensitive Information'
      impact: LOW
      likelihood: LOW
      references:
        - https://developer.android.com/guide/topics/manifest/application-element#usesCleartextTraffic
        - https://developer.android.com/training/articles/security-config
        - https://cwe.mitre.org/data/definitions/319.html
        - https://mas.owasp.org/MASVS/controls/MASVS-NETWORK-1/
      subcategory:
        - vuln
      technology:
        - android
    paths:
      include:
        - '*.xml'
    patterns:
      - pattern-either:
          # Need to define both orders, as the generic parser does not know that the order does not matter
          - pattern: |
              android:usesCleartextTraffic ... android:networkSecurityConfig
          - pattern: |
              android:networkSecurityConfig ... android:usesCleartextTraffic
      - pattern-not-inside: |
          <!-- ... -->
