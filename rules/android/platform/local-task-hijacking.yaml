rules:
  - id: android.local.task-hijacking-single-task
    languages:
      - xml
    severity: WARNING
    message: >-
      Activity uses singleTask launch mode. Review taskAffinity and exported state to prevent
      task hijacking and StrandHogg-style UI spoofing.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-1021: Improper Restriction of Rendered UI Layers or Frames'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://developer.android.com/privacy-and-security/risks/strandhogg
        - https://cwe.mitre.org/data/definitions/1021.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-1/
      subcategory:
        - vuln
      technology:
        - android
    pattern: <activity ... android:launchMode="singleTask" ... />
