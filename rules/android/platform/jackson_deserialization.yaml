rules:
  - id: android.mobsf.jackson_deserialization
    languages:
      - java
    severity: ERROR
    message: >-
      The app uses jackson deserialization library. Deserialization of untrusted input can result
      in arbitrary code execution. Consider using HMACs to sign the data stream to make sure it
      is not tampered with, or consider only transmitting object fields and populating a new
      object.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-502: Deserialization of Untrusted Data'
      impact: HIGH
      likelihood: LOW
      references:
        - https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05h-Testing-Platform-Interaction.md#testing-object-persistence-mstg-platform-8
        - https://cwe.mitre.org/data/definitions/502.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: m1
      masvs: platform-8
    patterns:
      - pattern-either:
          - pattern: |
              import com.fasterxml.jackson.databind.ObjectMapper;
              ...
              $Z.enableDefaultTyping();
