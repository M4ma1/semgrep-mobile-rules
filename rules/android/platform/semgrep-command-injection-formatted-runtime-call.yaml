rules:
  - id: android.semgrep.command-injection-formatted-runtime-call
    languages:
      - kotlin
    severity: ERROR
    message: >-
      A formatted or concatenated string was detected as input to a java.lang.Runtime call. This
      is dangerous if a variable is controlled by user input and could result in a command
      injection. Ensure your variables are not controlled by users or sufficiently sanitized.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      impact: HIGH
      likelihood: LOW
      references:
        - https://owasp.org/Top10/A03_2021-Injection
        - https://find-sec-bugs.github.io/bugs.htm#COMMAND_INJECTION.
        - https://cwe.mitre.org/data/definitions/78.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
        - kt
      owasp:
        - A01:2017 - Injection
        - A03:2021 - Injection
        - A05:2025 - Injection
      cwe2021-top25: true
      cwe2022-top25: true
    pattern-either:
      - pattern: $RUNTIME.exec($X + $Y)
      - pattern: $RUNTIME.exec(String.format(...))
      - pattern: $RUNTIME.loadLibrary($X + $Y)
      - pattern: $RUNTIME.loadLibrary(String.format(...))
