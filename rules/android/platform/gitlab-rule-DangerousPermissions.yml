# yamllint enable
rules:
  - id: android.gitlab.kotlin_perm_rule-DangerousPermissions
    languages:
      - kotlin
    severity: WARNING
    message: Do not grant dangerous combinations of permissions.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-277: Insecure Inherited Permissions'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/277.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp:
        - A5:2017-Broken Access Control
        - A01:2021-Broken Access Control
      security-severity: MEDIUM
      shortDescription: Insecure inherited permissions
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  $PC = $X.getPermissions(...)
                  ...
              - pattern: $PC.add($PERMISSION)
          - pattern: |
              $REFVAR = $PERMISSION
              ...;
              ($PC: PermissionCollection).add($REFVAR)
          - pattern: '($PC: PermissionCollection).add($PERMISSION)'
      - metavariable-pattern:
          metavariable: $PERMISSION
          pattern-either:
            - pattern: ReflectPermission("suppressAccessChecks")
            - pattern: RuntimePermission("createClassLoader")
