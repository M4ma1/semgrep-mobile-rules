rules:
  - id: android.unsecure_exported_component
    languages:
      - xml
    severity: WARNING
    message: >-
      This Android application exports an activity, activity-alias, service or broadcast receiver
      (android:exported="true", or an <intent-filter> with no android:exported="false"). Any
      application on the device can start, bind to or send to it, which may compromise the
      integrity of your application or its data. Ensure exported components do not give
      privileged access to your application's control plane. The launcher activity is not
      reported.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-926: Improper Export of Android Application Components'
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://mas.owasp.org/MASTG/tests/android/MASVS-PLATFORM/MASTG-TEST-0029/
        - https://cwe.mitre.org/data/definitions/926.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mas:
        identifier: MASVS-PLATFORM-1
        area: platform
        level:
          - L1
          - L2
      owasp-mobile: M8
      replaces:
        - android.unsecure_exported_activity
        - MSTG-PLATFORM-4_3
    patterns:
      - pattern-either:
          - pattern: |
              <activity ... android:exported="true" ... />
          - pattern: |
              <activity ... > ... <intent-filter> ... </activity>
          - pattern: |
              <activity-alias ... android:exported="true" ... />
          - pattern: |
              <activity-alias ... > ... <intent-filter> ... </activity-alias>
          - pattern: |
              <service ... android:exported="true" ... />
          - pattern: |
              <service ... > ... <intent-filter> ... </service>
          - pattern: |
              <receiver ... android:exported="true" ... />
          - pattern: |
              <receiver ... > ... <intent-filter> ... </receiver>
      - pattern-not-regex: android:exported="false"
      # the launcher activity must be exported; do not report it
      - pattern-not: |
          <activity ... >
            ...
            <intent-filter ...>
              ...
              <category android:name="android.intent.category.LAUNCHER" />
              ...
            </intent-filter>
            ...
          </activity>
      - pattern-not: |
          <activity-alias ... >
            ...
            <intent-filter ...>
              ...
              <category android:name="android.intent.category.LAUNCHER" />
              ...
            </intent-filter>
            ...
          </activity-alias>
