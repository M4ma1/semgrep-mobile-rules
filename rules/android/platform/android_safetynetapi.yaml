rules:
  - id: android.mobsf.android_safetynet_api
    languages:
      - java
    severity: INFO
    message: >-
      This app does not uses SafetyNet Attestation API that provides cryptographically-signed
      attestation, assessing the device's integrity. This check helps to ensure that the servers
      are interacting with the genuine app running on a genuine Android device.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-353: Missing Support for Integrity Check'
      impact: LOW
      likelihood: LOW
      references:
        - https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05j-Testing-Resiliency-Against-Reverse-Engineering.md#testing-root-detection-mstg-resilience-1
        - https://cwe.mitre.org/data/definitions/353.html
        - https://mas.owasp.org/MASVS/controls/MASVS-RESILIENCE-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: m8
      masvs: resilience-1
    patterns:
      - pattern-either:
          - pattern: |
              import com.google.android.gms.safetynet.SafetyNetApi;
          - pattern: |
              $S = SafetyNet.getClient(...);
              ...
              $T = $S.attest(...);
          - pattern: |
              new RNGoogleSafetyNetPackage(...)
