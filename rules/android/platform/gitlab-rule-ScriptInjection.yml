# yamllint enable
rules:
  - id: android.gitlab.kotlin_script_rule-ScriptInjection
    languages:
      - kotlin
    severity: ERROR
    message: >-
      The software constructs all or part of a code segment using externally-influenced input
      from an upstream component, but it does not neutralize or incorrectly neutralizes special
      elements that could modify the syntax or behavior of the intended code segment.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      impact: HIGH
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/94.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
      owasp:
        - A1:2017-Injection
        - A03:2021-Injection
      security-severity: CRITICAL
      shortDescription: Improper control of generation of code ('Code Injection')
    mode: taint
    pattern-sinks:
      - patterns:
          - patterns:
              - pattern-inside: |
                  $ENGINE = $F.getEngineByExtension(...)
                  ...
              - pattern: $ENGINE.eval($ARG, ...);
              - pattern-not: $ENGINE.eval("...");
              - pattern-not: '$ENGINE.eval("...", ($BINDING: javax.script.Bindings));'
      - patterns:
          - pattern: '($ENGINE: javax.script.ScriptEngine).eval($ARG, ...);'
          - pattern-not: '($ENGINE: javax.script.ScriptEngine).eval("...");'
          - pattern-not: '($ENGINE: javax.script.ScriptEngine).eval("...", ($BINDING: javax.script.Bindings));'
      - pattern: '($INVC: javax.script.Invocable).invokeFunction(..., $ARG)'
      - pattern: '($INVC: javax.script.Invocable).invokeMethod(..., $ARG)'
    pattern-sources:
      - patterns:
          - pattern-inside: |-
              fun $FUNC(..., $VAR: String, ...) { ... }
          - pattern: $VAR
