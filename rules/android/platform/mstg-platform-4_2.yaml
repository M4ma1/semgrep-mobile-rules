rules:
  - id: MSTG-PLATFORM-4_2
    languages:
      - java
    severity: WARNING
    message: >-
      Pending Intents not intended to be fired multiple times should use the "FLAG_ONE_SHOT" flag
      to avoid replay attacks.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-927: Use of Implicit Intent for Sensitive Communication'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05h-Testing-Platform-Interaction.md#testing-for-sensitive-functionality-exposure-through-ipc-mstg-platform-4
        - https://developer.android.com/topic/security/risks/pending-intent#risk_replaying_pending_intents
        - https://cwe.mitre.org/data/definitions/927.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: M1
      area: platform
      verification-level:
        - L1
        - L2
      authors:
        - Riccardo Cardelli @gand3lf (IMQ Minded Security)
    patterns:
      - pattern: PendingIntent.$M($A, $B, $C, $D, ...)
      - metavariable-regex:
          metavariable: $M
          regex: (getActivity|getActivities|getBroadcast|getForegroundService|getService)
      - metavariable-comparison:
          comparison: $D & 0x40000000 > 0
