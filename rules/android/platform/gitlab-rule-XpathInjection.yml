# yamllint enable
rules:
  - id: android.gitlab.kotlin_xpathi_rule-XpathInjection
    languages:
      - kotlin
    severity: ERROR
    message: >-
      The input values included in SQL queries need to be passed in safely. Bind variables in
      prepared statements can be used to easily mitigate the risk of SQL injection.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - "CWE-643: Improper Neutralization of Data within XPath Expressions ('XPath Injection')"
      impact: HIGH
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/643.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
      owasp:
        - A1:2017-Injection
        - A03:2021-Injection
      security-severity: CRITICAL
      shortDescription: Improper neutralization of data within XPath expressions ('XPath Injection')
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              fun $FUNC(..., $VAR: $T, ...) {
                ...
              }
          - pattern: $VAR
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: "import javax.xml.xpath.*; \n...\n"
              - pattern-inside: "import javax.xml.xpath.XPath; \n...\n"
          - patterns:
              - pattern-either:
                  - patterns:
                      - pattern: $X.compile($VAR)
                      - pattern-not: $X.compile("...")
                  - patterns:
                      - pattern: $X.evaluate($VAR, ...)
                      - pattern-not: $X.evaluate("...", ...)
    pattern-sanitizers:
      - pattern-either:
          - pattern-inside: |
              $X.xPathVariableResolver = ...;
              ...;
              $X.compile("...");
          - pattern-inside: |
              $X.setXPathVariableResolver(...);
              ...;
              $X.compile("...");
