# source (original): https://find-sec-bugs.github.io/bugs.htm
# yamllint enable
rules:
  - id: android.gitlab.kotlin_xml_rule-SAMLIgnoreComments
    languages:
      - kotlin
    severity: WARNING
    message: Ignoring XML comments in SAML may lead to authentication bypass
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-1390: Weak Authentication'
      impact: HIGH
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/1390.html
        - https://mas.owasp.org/MASVS/controls/MASVS-AUTH-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp:
        - A5:2017-Broken Access Control
        - A01:2021-Broken Access Control
      security-severity: MEDIUM
      shortDescription: Weak authentication
    pattern: '($POOL: org.opensaml.xml.parse.BasicParserPool).setIgnoreComments(false);'
