rules:
  - id: MSTG-PLATFORM-6_1
    languages:
      - java
    severity: WARNING
    message: WebView can load remote content from an endpoint or local file system in an unsafe manner.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-749: Exposed Dangerous Method or Function'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05h-Testing-Platform-Interaction.md#testing-webview-protocol-handlers-mstg-platform-6
        - https://cwe.mitre.org/data/definitions/749.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-2/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: M1
      area: platform
      verification-level:
        - L1
        - L2
      authors:
        - Christian Cotignola @b4dsheep (IMQ Minded Security)
    options:
      symbolic_propagation: true
    pattern-either:
      - patterns:
          - pattern: |
              WebView $WV = ...;
              ...
              $WV.loadUrl("$X");
          - metavariable-regex:
              metavariable: $X
              regex: ^(?!https?).*:\/\/.+$
      - patterns:
          - pattern: |
              class $WV extends WebView {
                ...
                $FUNC(...) {
                  ...
                  loadUrl("$Y");
                  ...
                }
              }
          - metavariable-regex:
              metavariable: $Y
              regex: ^(?!https?).*:\/\/.+$
      - patterns:
          - pattern: |
              class $WV extends WebView {
                ...
                $FUNC(...) {
                  ...
                  this.loadUrl("$Y");
                  ...
                }
              }
          - metavariable-regex:
              metavariable: $Y
              regex: ^(?!https?).*:\/\/.+$
      - patterns:
          - pattern: |
              WebView $WV = new WebView(...);
              ...
          - pattern-not-inside: |
              WebView $WV = $G;
              ...
              $WV.getSettings().setAllowFileAccess(false);
              ...
      - patterns:
          - pattern: |
              class $WV extends WebView {
                ...
              }
          - pattern-not: |
              class $WV extends WebView {
                ...
                $FUNC(...) {
                  ...
                  getSettings().setAllowFileAccess(false);
                  ...
                }
              }
      - patterns:
          - pattern: |
              class $WV extends WebView {
                ...
              }
          - pattern-not: |
              class $WV extends WebView {
                ...
                $FUNC(...) {
                  ...
                  this.getSettings().setAllowFileAccess(false);
                  ...
                }
              }
      - patterns:
          - pattern: |
              WebView $WV = new WebView(...);
              ...
          - pattern-not-inside: |
              WebView $WV = $G;
              ...
              $WV.getSettings().setAllowFileAccessFromFileURLs(false);
              ...
      - patterns:
          - pattern: |
              class $WV extends WebView {
                ...
              }
          - pattern-not: |
              class $WV extends WebView {
                ...
                $FUNC(...) {
                  ...
                  getSettings().setAllowFileAccessFromFileURLs(false);
                  ...
                }
              }
      - patterns:
          - pattern: |
              class $WV extends WebView {
                ...
              }
          - pattern-not: |
              class $WV extends WebView {
                ...
                $FUNC(...) {
                  ...
                  this.getSettings().setAllowFileAccessFromFileURLs(false);
                  ...
                }
              }
      - patterns:
          - pattern: |
              WebView $WV = new WebView(...);
              ...
          - pattern-not-inside: |
              WebView $WV = $G;
              ...
              $WV.getSettings().setAllowUniversalAccessFromFileURLs(false);
              ...
      - patterns:
          - pattern: |
              class $WV extends WebView {
                ...
              }
          - pattern-not: |
              class $WV extends WebView {
                ...
                $FUNC(...) {
                  ...
                  getSettings().setAllowUniversalAccessFromFileURLs(false);
                  ...
                }
              }
      - patterns:
          - pattern: |
              class $WV extends WebView {
                ...
              }
          - pattern-not: |
              class $WV extends WebView {
                ...
                $FUNC(...) {
                  ...
                  this.getSettings().setAllowUniversalAccessFromFileURLs(false);
                  ...
                }
              }
      - patterns:
          - pattern: |
              WebView $WV = new WebView(...);
              ...
          - pattern-not-inside: |
              WebView $WV = $G;
              ...
              $WV.getSettings().setAllowContentAccess(false);
              ...
      - patterns:
          - pattern: |
              class $WV extends WebView {
                ...
              }
