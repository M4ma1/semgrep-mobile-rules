# yamllint enable
rules:
  - id: android.gitlab.kotlin_xxe_rule-XMLRdr
    languages:
      - kotlin
    severity: ERROR
    message: >-
      XML External Entity (XXE) attacks can occur when an XML parser supports XML entities while
      processing XML received from an untrusted source.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-611: Improper Restriction of XML External Entity Reference'
      impact: HIGH
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/611.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
      owasp:
        - A1:2017-Injection
        - A03:2021-Injection
      security-severity: CRITICAL
      shortDescription: Improper restriction of XML external entity reference ('XXE')
    patterns:
      - pattern-inside: |
          $R = XMLReaderFactory.createXMLReader()
          ...
      - pattern-not-inside: |
          $R.setFeature(XMLConstants.FEATURE_SECURE_PROCESSING, true)
          ...
      - pattern: $R.parse(...)
