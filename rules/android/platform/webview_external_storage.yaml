rules:
  - id: android.mobsf.webview_external_storage
    languages:
      - java
    severity: ERROR
    message: >-
      WebView load files from external storage. Files in external storage can be modified by any
      application.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-922: Insecure Storage of Sensitive Information'
      impact: HIGH
      likelihood: MEDIUM
      references:
        - https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05h-Testing-Platform-Interaction.md#testing-webview-protocol-handlers-mstg-platform-6
        - https://cwe.mitre.org/data/definitions/922.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-2/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: m1
      masvs: platform-6
    patterns:
      - pattern-either:
          - pattern: |
              $X = <... $E.getExternalStorageDirectory() ...>;
              ...
              $WV.loadUrl(<... $X ...>);
          - pattern: |
              $WV.loadUrl(<... $E.getExternalStorageDirectory().$F() ...>);
          - pattern: |
              $X = <... Environment.getExternalStorageDirectory().$F() ...>;
              ...
              $WV.loadUrl(<... $X ...>);
          - pattern: |
              $X = <... $E.getExternalFilesDir(...) ...>;
              ...
              $WV.loadUrl(<... $X ...>);
