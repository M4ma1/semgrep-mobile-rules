# yamllint enable
rules:
  - id: android.gitlab.kotlin_xml_rule-XsltTransform
    languages:
      - kotlin
    severity: WARNING
    message: >-
      It is possible to attach malicious behavior to those style sheets. Therefore, if an
      attacker can control the content or the source of the style sheet, he might be able to
      trigger remote code execution.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-91: XML Injection (aka Blind XPath Injection)'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/91.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
      owasp:
        - A1:2017-Injection
        - A03:2021-Injection
      security-severity: MEDIUM
      shortDescription: XML injection (aka Blind XPath injection)
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      fun $FUNC(...,$VAR: String, ...) {
                        ...
                      }
                  - pattern-either:
                      - pattern: FileInputStream(<... $VAR ...>);
                      - pattern: javaClass.getResourceAsStream(<... $VAR ...>)
              - patterns:
                  - pattern-inside: |
                      class $CLZ {
                        var $X = "...";
                        ...
                      }
                  - pattern-inside: |
                      fun $FUNC(...,$Y: String, ...) {
                        ...
                      }
                  - pattern-either:
                      - pattern: FileInputStream($X + $Y);
                      - pattern: javaClass.getResourceAsStream($X + $Y)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern-inside: |-
                  ($T: javax.xml.transform.TransformerFactory).newTransformer($SRC, ...)
              - pattern-inside: |-
                  ($T: javax.xml.transform.Transformer).transform($SRC, ...)
              # flow instead of type assertion
              - patterns:
                  - pattern-inside: |-
                      $FACTORY = javax.xml.transform.TransformerFactory.newInstance(...)
                      ...
                  - pattern-inside: $FACTORY.newTransformer($SRC, ...)
              - patterns:
                  - pattern-inside: |-
                      $FACTORY = javax.xml.transform.TransformerFactory(...)
                      ...
                  - pattern-inside: |-
                      $T = $FACTORY.newTransformer(...)
                      ...
                  - pattern-inside: |-
                      $T.transform($SRC, ...)
          - pattern: $SRC
