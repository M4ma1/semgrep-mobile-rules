rules:
  - id: android.mobsf.android_certificate_pinning
    languages:
      - java
    severity: INFO
    message: >-
      This app does not use a TLS/SSL certificate or public key pinning in code to detect or
      prevent MITM attacks in secure communication channel. Please verify if pinning is enabled
      in `network_security_config.xml`.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-295: Improper Certificate Validation'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05g-Testing-Network-Communication.md#testing-custom-certificate-stores-and-certificate-pinning-mstg-network-4
        - https://cwe.mitre.org/data/definitions/295.html
        - https://mas.owasp.org/MASVS/controls/MASVS-NETWORK-2/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: m3
      masvs: network-4
    patterns:
      - pattern-either:
          - pattern: |
              import com.toyberman.RNSslPinningPackage;
          - pattern: |
              import org.thoughtcrime.ssl.pinning;
          - pattern: |
              new PinningValidationReportTestBroadcastReceiver()
          - pattern: |
              new CertificatePinner.Builder()
          - pattern: |
              CertificatePinner.Builder()
          - pattern: |
              TrustKit.getInstance().getSSLSocketFactory(...)
          - pattern: |
              $X = $R.openRawResource(...);
              ...
              $KS = KeyStore.getInstance(...);
              ...
              $KS.load($X, ...);
              ...
              $T.init($KS);
          - pattern: |
              TrustKit.initializeWithNetworkSecurityConfiguration(...);
          - pattern: |
              OkHttp2Helper.getPinningInterceptor()
          - pattern: |
              OkHttp3Helper.getPinningInterceptor()
          - pattern: |
              new PinningHostnameVerifier(...)
          - pattern: |
              PinningHelper.getPinnedHttpsURLConnection
          - pattern: |
              $F.openRawResource(...);
              ...
              $X = new Picasso.Builder(...);
