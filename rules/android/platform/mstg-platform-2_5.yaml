rules:
  - id: MSTG-PLATFORM-2_5
    languages:
      - java
    severity: WARNING
    message: >-
      Potential Fragment Injection found, check that the "android:targetSdkVersion" is not less
      than 19.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - "CWE-470: Use of Externally-Controlled Input to Select Classes or Code ('Unsafe Reflection')"
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05h-Testing-Platform-Interaction.md#testing-for-fragment-injection-mstg-platform-2
        - https://cwe.mitre.org/data/definitions/470.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: M7
      area: platform
      verification-level:
        - L1
        - L2
      authors:
        - Riccardo Cardelli @gand3lf (IMQ Minded Security)
    patterns:
      - pattern-either:
          - patterns:
              - pattern: class $CLASS extends PreferenceActivity{ ... }
              - pattern-not: class $CLASS extends PreferenceActivity{ ... @Override boolean isValidFragment(String $FNAME) { ... } ... }
          - pattern: boolean isValidFragment(String $FNAME) { return true; }
