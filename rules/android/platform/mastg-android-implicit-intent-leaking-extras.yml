rules:
  - id: android.owasp.implicit-intent-leaking-extras
    languages:
      - java
    severity: WARNING
    message: >-
      [MASVS-CODE-4] The app sends an implicit intent with extras. Any app that registers for
      this action can receive the data. Use explicit intents for internal communication.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-927: Use of Implicit Intent for Sensitive Communication'
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/927.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-1/
      subcategory:
        - vuln
      technology:
        - android
      summary: Detects implicit intents that carry extras without specifying a target package or component.
    patterns:
      - pattern: |
          $I = new Intent(...);
          ...
          $I.putExtra($KEY, $VAL);
          ...
          $CTX.startActivity($I);
      - pattern-not: |
          $I = new Intent($C, $CLASS);
          ...
      - pattern-not: |
          $I = new Intent(...);
          ...
          $I.setPackage(...);
          ...
          $CTX.startActivity($I);
      - pattern-not: |
          $I = new Intent(...);
          ...
          $I.setComponent(...);
          ...
          $CTX.startActivity($I);
