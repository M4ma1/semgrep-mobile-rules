rules:
  - id: MSTG-PLATFORM-2_4
    languages:
      - xml
    severity: WARNING
    message: >-
      FileProvider paths configuration exposes an overly broad scope: either a <root-path>
      element (device root filesystem) or a path that maps a whole base directory (".", "./",
      "/", "*"). Narrow it to a specific subdirectory that contains only files intended for
      sharing.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-552: Files or Directories Accessible to External Parties'
      impact: HIGH
      likelihood: MEDIUM
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05h-Testing-Platform-Interaction.md#testing-for-injection-flaws-mstg-platform-2
        - https://cwe.mitre.org/data/definitions/552.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: M7
      area: platform
      verification-level:
        - L1
        - L2
      authors:
        - Riccardo Cardelli @gand3lf (IMQ Minded Security)
      replaces:
        - android.owasp.fileprovider-broad-path-scope
        - android.owasp.fileprovider-root-path
    patterns:
      - pattern-inside: <paths />
      - pattern-either:
          - pattern: <root-path ... />
          - patterns:
              - pattern-either:
                  - pattern: <files-path path="$PATH" />
                  - pattern: <cache-path path="$PATH" />
                  - pattern: <external-path path="$PATH" />
                  - pattern: <external-files-path path="$PATH" />
                  - pattern: <external-cache-path path="$PATH" />
                  - pattern: <external-media-path path="$PATH" />
              - metavariable-regex:
                  metavariable: $PATH
                  regex: ^[\/\.\*]\/?$
