# yamllint enable
rules:
  - id: android.gitlab.kotlin_xss_rule-WicketXSS
    languages:
      - kotlin
    severity: WARNING
    message: Disabling HTML escaping put the application at risk for Cross-Site Scripting (XSS).
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/79.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
      owasp:
        - A1:2017-Injection
        - A03:2021-Injection
      security-severity: MEDIUM
      shortDescription: Improper neutralization of input during web page generation ('Cross-site Scripting')
    patterns:
      - pattern-inside: |
          import org.apache.wicket.$A
          ...
      - pattern: |
          $OBJ.setEscapeModelStrings(false);
