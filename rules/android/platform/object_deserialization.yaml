rules:
  - id: android.mobsf.object_deserialization
    languages:
      - java
    severity: WARNING
    message: >-
      Found object deserialization using ObjectInputStream. Deserializing entire Java objects is
      dangerous because malicious actors can create Java object streams with unintended
      consequences. Ensure that the objects being deserialized are not user-controlled. Consider
      using HMACs to sign the data stream to make sure it is not tampered with, or consider only
      transmitting object fields and populating a new object.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-502: Deserialization of Untrusted Data'
      impact: HIGH
      likelihood: MEDIUM
      references:
        - https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05h-Testing-Platform-Interaction.md#testing-object-persistence-mstg-platform-8
        - https://cwe.mitre.org/data/definitions/502.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: m1
      masvs: platform-8
      replaces:
        - android.owasp.object-deserialization
    patterns:
      - pattern-either:
          - pattern: new ObjectInputStream(...);
          - pattern: new java.io.ObjectInputStream(...);
