# yamllint enable
rules:
  - id: android.gitlab.kotlin_templateinjection_rule-TemplateInjection
    languages:
      - kotlin
    severity: ERROR
    message: >-
      A malicious user in control of a template can run malicious code on the server-side.
      Velocity templates should be seen as scripts.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      impact: HIGH
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/94.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
      owasp:
        - A1:2017-Injection
        - A03:2021-Injection
      security-severity: CRITICAL
      shortDescription: Improper control of generation of code ('Code Injection')
    pattern-either:
      - patterns:
          - pattern: org.apache.velocity.app.Velocity.evaluate(..., $VAR)
          - pattern-not: org.apache.velocity.app.Velocity.evaluate(..., "...")
      - patterns:
          - pattern-not-inside: |
              $C = ($CFG: freemarker.template.Configuration).getTemplate("...");
              ...
          - pattern-inside: |
              $C = ($CFG: freemarker.template.Configuration).getTemplate($IN);
              ...
          - pattern: $C.process(...)
      - patterns:
          - pattern-inside: |
              import com.mitchellbosecke.pebble.PebbleEngine;
              ...
          - pattern-inside: |
              $C = $T.getTemplate($IN);
              ...
          - pattern-not-inside: |
              $C = $T.getTemplate("...");
              ...
          - pattern: $C.evaluate(...)
