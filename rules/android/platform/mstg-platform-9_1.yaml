rules:
  - id: MSTG-PLATFORM-9_1
    languages:
      - java
    severity: WARNING
    message: The application does not enforce any security policy to prevent overlay attacks.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-1021: Improper Restriction of Rendered UI Layers or Frames'
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05h-Testing-Platform-Interaction.md#testing-for-overlay-attacks-mstg-platform-9
        - https://cwe.mitre.org/data/definitions/1021.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-3/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: M2
      area: platform
      verification-level:
        - L2
      authors:
        - Michele Tumolo @zer0s0urce (IMQ Minded Security)
        - Giovanni Fazi @giovifazi (IMQ Minded Security)
    patterns:
      - pattern: |
          public class $MAINACTIVITY extends $ACTIVITY{
             public void onCreate(...){...}
          }

      - pattern-not: |
          public class $MAINACTIVITY extends $ACTIVITY{
             ...
             onFilterTouchEventForSecurity($NAME event) {...}
             ...
          }

      - pattern-not: |
          public class $MAINACTIVITY extends $ACTIVITY{
             $X(...){
             ...
             $OBJECT.setFilterTouchesWhenObscured(true);
             ...
             }
          }
      - metavariable-regex:
          metavariable: $ACTIVITY
          regex: .*(?i)(activity).*
      - focus-metavariable:
          - $MAINACTIVITY
