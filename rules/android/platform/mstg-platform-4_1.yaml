rules:
  - id: MSTG-PLATFORM-4_1
    languages:
      - java
    severity: WARNING
    message: >-
      Pending Intents must be declared as immutable and specify the exact package, action, and
      component that will receive the base intent.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-927: Use of Implicit Intent for Sensitive Communication'
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05h-Testing-Platform-Interaction.md#testing-for-sensitive-functionality-exposure-through-ipc-mstg-platform-4
        - https://cwe.mitre.org/data/definitions/927.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: M1
      area: platform
      verification-level:
        - L1
        - L2
      authors:
        - Riccardo Cardelli @gand3lf (IMQ Minded Security)
    patterns:
      - pattern-inside: |
          $T(...){
            ...
            (PendingIntent $I) = PendingIntent.$M($A, $B, $C, $D, ...);
            ...
          }
      - pattern-not-inside: |
          $T(...){
            ...
            (PendingIntent $E) = PendingIntent.$M(...);
            ...
            $E.setClassName(...);
            ...
          }
      - pattern: PendingIntent.$M($A, $B, $C, $D, ...)
      - metavariable-regex:
          metavariable: $M
          regex: (getActivity|getActivities|getBroadcast|getForegroundService|getService)
      - metavariable-comparison:
          comparison: $D & 0x04000000 > 0
