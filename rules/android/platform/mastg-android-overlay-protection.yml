rules:
  - id: android.owasp.overlay-protection-setfiltertoucheswhenobscured
    languages:
      - java
    severity: INFO
    message: '[MASVS-PLATFORM-3] setFilterTouchesWhenObscured is used to protect against overlay attacks'
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-1021: Improper Restriction of Rendered UI Layers or Frames'
      impact: LOW
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/1021.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-3/
      subcategory:
        - vuln
      technology:
        - android
      summary: Detects usage of setFilterTouchesWhenObscured method for overlay attack protection
      replaces:
        - android.mobsf.android_detect_tapjacking
    pattern: $VIEW.setFilterTouchesWhenObscured(...)

  - id: android.owasp.overlay-protection-onfiltertoucheventforsecurity
    languages:
      - java
    severity: INFO
    message: >-
      [MASVS-PLATFORM-3] onFilterTouchEventForSecurity is overridden for custom overlay protection
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-1021: Improper Restriction of Rendered UI Layers or Frames'
      impact: LOW
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/1021.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-3/
      subcategory:
        - vuln
      technology:
        - android
      summary: Detects overriding of onFilterTouchEventForSecurity for custom overlay protection
    pattern: |
      public boolean onFilterTouchEventForSecurity(...) { ... }

  - id: android.owasp.overlay-protection-flag-window-is-obscured
    languages:
      - java
    severity: INFO
    message: '[MASVS-PLATFORM-3] FLAG_WINDOW_IS_OBSCURED is checked to detect overlay attacks'
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-1021: Improper Restriction of Rendered UI Layers or Frames'
      impact: LOW
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/1021.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-3/
      subcategory:
        - vuln
      technology:
        - android
      summary: Detects checks for FLAG_WINDOW_IS_OBSCURED flag to detect overlay attacks
    pattern-either:
      - pattern: $EVENT.getFlags() & MotionEvent.FLAG_WINDOW_IS_OBSCURED
      - pattern: ($EVENT.getFlags() & MotionEvent.FLAG_WINDOW_IS_OBSCURED) != 0

  - id: android.owasp.overlay-protection-flag-window-is-partially-obscured
    languages:
      - java
    severity: INFO
    message: '[MASVS-PLATFORM-3] FLAG_WINDOW_IS_PARTIALLY_OBSCURED is checked to detect overlay attacks'
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-1021: Improper Restriction of Rendered UI Layers or Frames'
      impact: LOW
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/1021.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-3/
      subcategory:
        - vuln
      technology:
        - android
      summary: Detects checks for FLAG_WINDOW_IS_PARTIALLY_OBSCURED flag to detect overlay attacks
    pattern-either:
      - pattern: $EVENT.getFlags() & MotionEvent.FLAG_WINDOW_IS_PARTIALLY_OBSCURED
      - pattern: ($EVENT.getFlags() & MotionEvent.FLAG_WINDOW_IS_PARTIALLY_OBSCURED) != 0

  - id: android.owasp.overlay-protection-xml-attribute
    languages:
      - xml
    severity: INFO
    message: >-
      [MASVS-PLATFORM-3] android:filterTouchesWhenObscured attribute is used to protect against
      overlay attacks
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-1021: Improper Restriction of Rendered UI Layers or Frames'
      impact: LOW
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/1021.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-3/
      subcategory:
        - vuln
      technology:
        - android
      summary: Detects filterTouchesWhenObscured attribute in layout XML files
    pattern: android:filterTouchesWhenObscured="true"

  - id: android.owasp.overlay-protection-sethideoverlaywindows
    languages:
      - java
    severity: INFO
    message: >-
      [MASVS-PLATFORM-3] setHideOverlayWindows is used to prevent overlay windows from appearing
      over this window
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-1021: Improper Restriction of Rendered UI Layers or Frames'
      impact: LOW
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/1021.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-3/
      subcategory:
        - vuln
      technology:
        - android
      summary: Detects usage of setHideOverlayWindows to prevent overlay windows from appearing over the activity
    pattern: $WINDOW.setHideOverlayWindows(...)

  - id: android.owasp.overlay-protection-hide-overlay-windows-permission
    languages:
      - xml
    severity: INFO
    message: >-
      [MASVS-PLATFORM-3] HIDE_OVERLAY_WINDOWS permission is declared, required to use
      setHideOverlayWindows
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-1021: Improper Restriction of Rendered UI Layers or Frames'
      impact: LOW
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/1021.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-3/
      subcategory:
        - vuln
      technology:
        - android
      summary: Detects HIDE_OVERLAY_WINDOWS permission in the manifest, required for setHideOverlayWindows
    pattern: android:name="android.permission.HIDE_OVERLAY_WINDOWS"
