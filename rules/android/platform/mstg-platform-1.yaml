rules:
  - id: MSTG-PLATFORM-1
    languages:
      - xml
    severity: WARNING
    message: The application should request the minimum set of necessary permissions.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-250: Execution with Unnecessary Privileges'
      impact: LOW
      likelihood: LOW
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05h-Testing-Platform-Interaction.md#testing-for-app-permissions-mstg-platform-1
        - https://cwe.mitre.org/data/definitions/250.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: M1
      area: platform
      verification-level:
        - L1
        - L2
      authors:
        - Riccardo Cardelli @gand3lf (IMQ Minded Security)
      replaces:
        - detect-dangerous-android-permissions
    pattern-either:
      # Access to location
      - patterns:
          - pattern: <uses-permission android:name="$P"/>
          - metavariable-regex:
              metavariable: $P
              regex: android\.permission\..*(LOCATION).*
      # Access to contacts
      - patterns:
          - pattern: <uses-permission android:name="$P"/>
          - metavariable-regex:
              metavariable: $P
              regex: android\.permission\..*(CONTACTS).*
      # Other dangerous permissions
      - patterns:
          - pattern: <uses-permission android:name="$P"/>
          - metavariable-regex:
              metavariable: $P
              regex: android\.permission\.(READ_CALENDAR|WRITE_CALENDAR|READ_CALL_LOG|WRITE_CALL_LOG|PROCESS_OUTGOING_CALLS|CAMERA|GET_ACCOUNTS|RECORD_AUDIO|READ_PHONE_STATE|READ_PHONE_NUMBERS|CALL_PHONE|ANSWER_PHONE_CALLS|ADD_VOICEMAIL|USE_SIP|BODY_SENSORS|SEND_SMS|RECEIVE_SMS|READ_SMS|RECEIVE_WAP_PUSH|RECEIVE_MMS|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE)
      # Dangerous / special permissions added in newer Android versions
      # (ported from detect-dangerous-android-permissions) + MANAGE_EXTERNAL_STORAGE
      - patterns:
          - pattern: <uses-permission android:name="$P"/>
          - metavariable-regex:
              metavariable: $P
              regex: android\.permission\.(READ_CELL_BROADCASTS|READ_MEDIA_AUDIO|READ_MEDIA_VIDEO|READ_MEDIA_IMAGES|READ_MEDIA_VISUAL_USER_SELECTED|ACCEPT_HANDOVER|ACTIVITY_RECOGNITION|POST_NOTIFICATIONS|BLUETOOTH_SCAN|BLUETOOTH_CONNECT|BLUETOOTH_ADVERTISE|UWB_RANGING|NEARBY_WIFI_DEVICES|RANGING|MANAGE_EXTERNAL_STORAGE)
      # Voicemail permission lives in a different namespace
      - patterns:
          - pattern: <uses-permission android:name="$P"/>
          - metavariable-regex:
              metavariable: $P
              regex: com\.android\.voicemail\.permission\.ADD_VOICEMAIL
      # Deprecated permissions
      - patterns:
          - pattern: <uses-permission android:name="$P"/>
          - metavariable-regex:
              metavariable: $P
              regex: android\.permission\.(BIND_CARRIER_MESSAGING_SERVICE|BIND_CHOOSER_TARGET_SERVICE|GET_TASKS|PERSISTENT_ACTIVITY|PROCESS_OUTGOING_CALLS|READ_INPUT_STATE|RESTART_PACKAGES|SET_PREFERRED_APPLICATIONS|SMS_FINANCIAL_TRANSACTIONS|USE_FINGERPRINT)
      # custom permissions with deprecated/dangerous protectionLevel
      - patterns:
          - pattern: <permission ... android:protectionLevel="$P"/>
          - metavariable-regex:
              metavariable: $P
              regex: (signatureOrSystem|system|dangerous)
