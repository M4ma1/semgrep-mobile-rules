# yamllint enable
rules:
  - id: android.gitlab.kotlin_inject_rule-HttpParameterPollution
    languages:
      - kotlin
    severity: ERROR
    message: >-
      Concatenating unvalidated user input into a URL can allow an attacker to override the value
      of a request parameter. Attacker may be able to override existing parameter values, inject
      a new parameter or exploit variables out of a direct reach. HTTP Parameter Pollution (HPP)
      attacks consist of injecting encoded query string delimiters into other existing
      parameters. If a web application does not properly sanitize the user input, a malicious
      user may compromise the logic of the application to perform either client-side or
      server-side attacks.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - "CWE-88: Improper Neutralization of Argument Delimiters in a Command ('Argument Injection')"
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/88.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
        - kotlin
      owasp:
        - A1:2017-Injection
        - A03:2021-Injection
      security-severity: CRITICAL
      shortDescription: Improper neutralization of argument delimiters in a command ('Argument Injection')
    mode: taint
    pattern-sources:
      - pattern: '($REQ: HttpServletRequest).getParameter(...)'
    pattern-sanitizers:
      - pattern: java.net.URLEncoder.encode(...)
      - pattern: com.google.common.net.UrlEscapers.urlPathSegmentEscaper().escape(...)
    pattern-sinks:
      - pattern: org.apache.http.client.methods.HttpGet(...)
      - pattern: org.apache.commons.httpclient.methods.GetMethod(...)
      - pattern: '($GM: org.apache.commons.httpclient.methods.GetMethod).setQueryString(...)'
