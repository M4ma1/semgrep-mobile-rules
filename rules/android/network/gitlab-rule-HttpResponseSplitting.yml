# yamllint enable
rules:
  - id: android.gitlab.kotlin_cookie_rule-HttpResponseSplitting
    languages:
      - kotlin
    severity: WARNING
    message: >-
      When an HTTP request contains unexpected CR and LF characters, the server may respond with
      an output stream that is interpreted as two different HTTP responses (instead of one). An
      attacker can control the second response and mount attacks such as cross-site scripting and
      cache poisoning attacks.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - "CWE-113: Improper Neutralization of CRLF Sequences in HTTP Headers ('HTTP Request/Response Splitting')"
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/113.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
        - kotlin
      owasp:
        - A1:2017-Injection
        - A03:2021-Injection
      security-severity: MEDIUM
      shortDescription: Improper neutralization of CRLF sequences in HTTP headers ('HTTP Response Splitting')
    mode: taint
    pattern-sanitizers:
      - patterns:
          # a string that might be empty
          - metavariable-pattern:
              metavariable: $S0
              pattern-either:
                - pattern: '...'
                - pattern: '""'
          # replace pattern should include a character class with \r and \n
          - metavariable-pattern:
              metavariable: $PATTERN
              patterns:
                - pattern: '...'
                - pattern-regex: .*\[\]?(?=[^]]*\\r)(?=[^]]*\\n)[^]]*\]\+
          - pattern-inside: |
              $STR.replace($PATTERN, $S0)
              ...
      - pattern: org.apache.commons.text.StringEscapeUtils.escapeJava(...)
    pattern-sinks:
      - pattern: javax.servlet.http.Cookie("$KEY", ...)
      - patterns:
          - pattern-inside: |
              $C = javax.servlet.http.Cookie("$KEY", ...)
              ...
          - pattern: $C.setValue(...)
    pattern-sources:
      - pattern: '($REQ: javax.servlet.http.HttpServletRequest).getParameter(...)'
      - pattern: '($REQ: javax.servlet.http.HttpServletRequest).getParameterNames()'
      - pattern: '($REQ: javax.servlet.http.HttpServletRequest).getParameterValues(...)'
      - pattern: '($REQ: javax.servlet.http.HttpServletRequest).getParameterMap()'
      - pattern: '($REQ: javax.servlet.http.HttpServletRequest).getHeader(...)'
      - pattern: '($REQ: javax.servlet.http.HttpServletRequest).getPathInfo()'
