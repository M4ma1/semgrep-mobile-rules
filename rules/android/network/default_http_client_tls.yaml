# https://find-sec-bugs.github.io/bugs.htm#DEFAULT_HTTP_CLIENT
rules:
  - id: android.mobsf.default_http_client_tls
    languages:
      - java
    severity: WARNING
    message: DefaultHTTPClient() with default constructor is not compatible with TLS 1.2.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - "CWE-757: Selection of Less-Secure Algorithm During Negotiation ('Algorithm Downgrade')"
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://github.com/MobSF/owasp-mstg/blob/master/Document/0x04f-Testing-Network-Communication.md#verifying-data-encryption-on-the-network-mstg-network-1-and-mstg-network-2
        - https://cwe.mitre.org/data/definitions/757.html
        - https://mas.owasp.org/MASVS/controls/MASVS-NETWORK-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: m3
      masvs: network-2
    patterns:
      - pattern-either:
          - pattern: |
              new DefaultHttpClient()
