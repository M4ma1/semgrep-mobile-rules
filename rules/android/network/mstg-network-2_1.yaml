rules:
  - id: MSTG-NETWORK-2_1
    languages:
      - java
    severity: WARNING
    message: Weak transport protocol version $PROTO is used.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-326: Inadequate Encryption Strength'
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://github.com/OWASP/owasp-mastg/tree/v1.5.0/Document/0x04f-Testing-Network-Communication.md
        - https://cwe.mitre.org/data/definitions/326.html
        - https://mas.owasp.org/MASVS/controls/MASVS-NETWORK-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: M3
      area: network
      verification-level:
        - L1
        - L2
      authors:
        - Giacomo Zorzin @gellge (IMQ Minded Security)
    options:
      symbolic_propagation: true
    patterns:
      - pattern-inside: |
          $FUN(...){
            ...
          }
      - pattern: |
          SSLContext.getInstance("$PROTO",...);
          ...
          (SSLContext $OBJ).init(...);
      - metavariable-regex:
          metavariable: $PROTO
          regex: (?i)(?!TLSv1.[23])
