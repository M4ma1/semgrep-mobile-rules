# yamllint enable
rules:
  - id: android.gitlab.kotlin_smtp_rule-SmtpClient
    languages:
      - kotlin
    severity: ERROR
    message: >-
      Simple Mail Transfer Protocol (SMTP) is a the text based protocol used for email delivery.
      Like with HTTP, headers are separate by new line separator. If kuser input is place in a
      header line, the application should remove or replace new line characters (CR / LF). You
      should use a safe wrapper such as Apache Common Email and Simple Java Mail which filter
      special characters that can lead to header injection.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - "CWE-77: Improper Neutralization of Special Elements used in a Command ('Command Injection')"
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/77.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
      owasp:
        - A1:2017-Injection
        - A03:2021-Injection
      security-severity: CRITICAL
      shortDescription: Improper neutralization of special elements used in a command
    patterns:
      - pattern-inside: |
          $M = MimeMessage(...);
          ...
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $M.setSubject($VAR)
                  - pattern: $M.addHeader($ARG, $VAR)
                  - pattern: $M.addHeader($VAR, $ARG)
                  - pattern: $M.setDescription($VAR)
                  - pattern: $M.setDisposition($VAR)
              - metavariable-regex:
                  metavariable: $VAR
                  regex: ^[a-zA-Z_$][a-zA-Z0-9_$]*$
          - patterns:
              - pattern-either:
                  - pattern: $M.setSubject($OBJ.$GETTER(...))
                  - pattern: $M.setSubject($OBJ.$GETTER(...) + ...)
                  - pattern: $M.setSubject(... + $OBJ.$GETTER(...))
                  - pattern: $M.setSubject(... + $OBJ.$GETTER(...) + ...)
                  - pattern: $M.addHeader($ARG, $OBJ.$GETTER(...))
                  - pattern: $M.addHeader($ARG, $OBJ.$GETTER(...) + ...)
                  - pattern: $M.addHeader($ARG, ... + $OBJ.$GETTER(...))
                  - pattern: $M.addHeader($ARG, ... + $OBJ.$GETTER(...) + ...)
                  - pattern: $M.addHeader($OBJ.$GETTER(...), $ARG)
                  - pattern: $M.addHeader($OBJ.$GETTER(...) + ..., $ARG)
                  - pattern: $M.addHeader(... + $OBJ.$GETTER(...), $ARG)
                  - pattern: $M.addHeader(... + $OBJ.$GETTER(...) + ..., $ARG)
                  - pattern: $M.setDescription($OBJ.$GETTER(...))
                  - pattern: $M.setDisposition($OBJ.$GETTER(...) + ...)
                  - pattern: $M.setDisposition(... + $OBJ.$GETTER(...))
                  - pattern: $M.setDisposition(... + $OBJ.$GETTER(...) + ...)
              - metavariable-regex:
                  metavariable: $GETTER
                  regex: ^get
