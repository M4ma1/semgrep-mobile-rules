rules:
  - id: MSTG-NETWORK-1_1
    languages:
      - xml
    severity: WARNING
    message: >-
      The application transmits information over insecure channels through the use of
      HttpURLConnection. It is recommended to verify if the Network Security Configuration is
      appropriately configured to prevent such insecure transmissions.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-319: Cleartext Transmission of Sensitive Information'
      impact: HIGH
      likelihood: MEDIUM
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05g-Testing-Network-Communication.md#testing-data-encryption-on-the-network-mstg-network-1
        - https://cwe.mitre.org/data/definitions/319.html
        - https://mas.owasp.org/MASVS/controls/MASVS-NETWORK-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: M1
      area: storage
      verification-level:
        - L1
        - L2
      authors:
        - Andrea Agnello (IMQ Minded Security)
        - Riccardo Granata (IMQ Minded Security)
    paths:
      include:
        - '**/AndroidManifest.xml'
    pattern-either:
      - patterns:
          - pattern: <uses-sdk ... android:targetSdkVersion="$VE" .../>
          - metavariable-comparison:
              comparison: int($VE) < 28
              metavariable: $VE
      - patterns:
          - pattern: <application ... android:usesCleartextTraffic="true" ... />
