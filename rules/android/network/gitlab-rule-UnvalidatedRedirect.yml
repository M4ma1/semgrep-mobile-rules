# yamllint enable
rules:
  - id: android.gitlab.kotlin_endpoint_rule-UnvalidatedRedirect
    languages:
      - kotlin
    severity: ERROR
    message: >-
      Unvalidated redirects occur when an application redirects a user to a destination URL
      specified by a user supplied parameter that is not validated. Such vulnerabilities can be
      used to facilitate phishing attacks.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - "CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/601.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-4/
      subcategory:
        - vuln
      technology:
        - android
      owasp:
        - A1:2017-Injection
        - A03:2021-Injection
      security-severity: CRITICAL
      shortDescription: URL redirection to untrusted site ('Open Redirect')
    mode: taint
    pattern-sources:
      - patterns:
          - pattern: |
              $URL = ($REQ: $X.servlet.http.HttpServletRequest).$M(...);
          - metavariable-regex:
              metavariable: $M
              regex: (getParameter|getCookies|getHeader|getHeaders|getHeaderNames|getPathInfo|getPathTranslated|getContextPath|getQueryString|getRemoteUser|getRequestedSessionId|getRequestURI|getRequestURL|getServletPath|getParts|getPart|getReader)
    pattern-sinks:
      - pattern-either:
          - pattern: |
              ($RES: $X.servlet.http.HttpServletResponse).sendRedirect($URL)
          - pattern: |
              ($RES: $X.servlet.http.HttpServletResponse).addHeader("Location", $URL)
    pattern-sanitizers:
      - patterns:
          - pattern-inside: |
              if ($SAFE.contains($URL)){
                ...
              }
          - pattern-either:
              - pattern: |
                  ($RES: $X.servlet.http.HttpServletResponse).sendRedirect($URL)
              - pattern: |
                  ($RES: $X.servlet.http.HttpServletResponse).addHeader("Location", $URL)
