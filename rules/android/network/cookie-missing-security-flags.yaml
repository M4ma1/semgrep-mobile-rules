rules:
  - id: android.cookie-missing-security-flags
    languages:
      - kotlin
    severity: WARNING
    message: >-
      A cookie was detected without the 'HttpOnly' and/or 'Secure' flag. 'HttpOnly' forbids
      client-side scripts from reading the cookie, and 'Secure' prevents the client from
      transmitting it over insecure channels such as HTTP. Set both flags by calling
      '$COOKIE.setHttpOnly(true)' and '$COOKIE.setSecure(true)' before the cookie is added to the
      response.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - "CWE-1004: Sensitive Cookie Without 'HttpOnly' Flag"
        - "CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"
      impact: LOW
      likelihood: LOW
      references:
        - https://owasp.org/Top10/A05_2021-Security_Misconfiguration
        - https://find-sec-bugs.github.io/bugs.htm#HTTPONLY_COOKIE
        - https://find-sec-bugs.github.io/bugs.htm#INSECURE_COOKIE
        - https://cwe.mitre.org/data/definitions/1004.html
        - https://cwe.mitre.org/data/definitions/614.html
        - https://mas.owasp.org/MASVS/controls/MASVS-PLATFORM-1/
      subcategory:
        - vuln
      technology:
        - android
        - kotlin
      owasp:
        - A05:2021 - Security Misconfiguration
        - A02:2025 - Security Misconfiguration
      replaces:
        - android.semgrep.cookie-missing-httponly
        - android.semgrep.cookie-missing-secure-flag
        - android.gitlab.kotlin_cookie_rule-CookieHTTPOnly
        - android.gitlab.kotlin_cookie_rule-CookieInsecure
    patterns:
      - pattern-not-inside: |
          $COOKIE.setValue("")
          ...
      - pattern-either:
          # Flag explicitly disabled
          - pattern: $COOKIE.setHttpOnly(false)
          - pattern: $COOKIE.setSecure(false)
          # Cookie added to the response without ever setting the flag
          - patterns:
              - pattern-not-inside: |
                  $COOKIE.setHttpOnly(...)
                  ...
              - pattern: $RESPONSE.addCookie($COOKIE)
          - patterns:
              - pattern-not-inside: |
                  $COOKIE.setSecure(...)
                  ...
              - pattern: $RESPONSE.addCookie($COOKIE)
