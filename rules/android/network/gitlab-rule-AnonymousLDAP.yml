# source (original): https://find-sec-bugs.github.io/bugs.htm
# yamllint enable
rules:
  - id: android.gitlab.kotlin_ldap_rule-AnonymousLDAP
    languages:
      - kotlin
    severity: WARNING
    message: >-
      Without proper access control, executing an LDAP statement that contains a user-controlled
      value can allow an attacker to abuse poorly configured LDAP context
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-306: Missing Authentication for Critical Function'
      impact: HIGH
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/306.html
        - https://mas.owasp.org/MASVS/controls/MASVS-AUTH-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp:
        - A2:2017-Broken Authentication
        - A07:2021-Identification and Authentication Failures
      security-severity: MEDIUM
      shortDescription: Missing authentication for critical function (LDAP)
    patterns:
      - pattern-inside: |
          import javax.naming.Context
          ...
      - pattern: $ENV[Context.SECURITY_AUTHENTICATION] = "none"
