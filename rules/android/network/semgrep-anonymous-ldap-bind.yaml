rules:
  - id: android.semgrep.anonymous-ldap-bind
    languages:
      - kotlin
    severity: WARNING
    message: >-
      Detected anonymous LDAP bind. This permits anonymous users to execute LDAP statements.
      Consider enforcing authentication for LDAP. See
      https://docs.oracle.com/javase/tutorial/jndi/ldap/auth_mechs.html for more information.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-287: Improper Authentication'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures
        - https://find-sec-bugs.github.io/bugs.htm#LDAP_ANONYMOUS
        - https://cwe.mitre.org/data/definitions/287.html
        - https://mas.owasp.org/MASVS/controls/MASVS-AUTH-1/
      subcategory:
        - vuln
      technology:
        - android
        - kotlin
      owasp:
        - A02:2017 - Broken Authentication
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
      cwe2021-top25: true
      cwe2022-top25: true
    pattern: |
      $ENV.put($CTX.SECURITY_AUTHENTICATION, "none")
      ...
      $DCTX = InitialDirContext($ENV, ...)
