# yamllint enable
rules:
  - id: android.gitlab.kotlin_smtp_rule-InsecureSmtp
    languages:
      - kotlin
    severity: ERROR
    message: Server identity verification is disabled when making SSL connections.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-297: Improper Validation of Certificate with Host Mismatch'
      impact: HIGH
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/297.html
        - https://mas.owasp.org/MASVS/controls/MASVS-NETWORK-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp:
        - A3:2017-Sensitive Data Exposure
        - A02:2021-Cryptographic Failures
      security-severity: CRITICAL
      shortDescription: Improper validation of certificate with host mismatch
    patterns:
      - pattern-either:
          - pattern-inside: |
              $E = org.apache.commons.mail.SimpleEmail(...)
              ...
          - pattern-inside: |
              $E = org.apache.commons.mail.Email(...)
              ...
          - pattern-inside: |
              $E = org.apache.commons.mail.MultiPartEmail(...)
              ...
          - pattern-inside: |
              $E = org.apache.commons.mail.HtmlEmail(...)
              ...
          - pattern-inside: |
              $E = org.apache.commons.mail.ImageHtmlEmail(...)
              ...
      - pattern-not: |
          $E.setSSLOnConnect(true)
          ...
          $E.setSSLCheckServerIdentity(true)
