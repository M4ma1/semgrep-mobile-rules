rules:
  - id: MSTG-NETWORK-1_2
    languages:
      - java
    severity: WARNING
    message: >-
      The application could send information over insecure channels or not use the
      getDefaultHostnameVerifier method for SSLSocket
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-295: Improper Certificate Validation'
      impact: HIGH
      likelihood: MEDIUM
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05g-Testing-Network-Communication.md#testing-data-encryption-on-the-network-mstg-network-1
        - https://cwe.mitre.org/data/definitions/295.html
        - https://mas.owasp.org/MASVS/controls/MASVS-NETWORK-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: M1
      area: storage
      verification-level:
        - L1
        - L2
      authors:
        - Riccardo Granata (IMQ Minded Security)
        - Andrea Agnello (IMQ Minded Security)
    paths:
      exclude:
        - '**/okhttp3/**'
        - '**/volley/**'
        - '**/okio/**'
        - '**/retrofit2/**'
        - '**/Ion/**'
        - '**/asynchttpclient/**'
        - '**/fuel/**'
        - '**/android-async-http/**'
    pattern-either:
      - patterns:
          - pattern-inside: |
              $METHOD(...){...}
          - pattern: Socket $SOCKET = new Socket(...);
      - patterns:
          - pattern-inside: |
              $METHOD(...){...}
          - pattern: $CONNECTION = (HttpURLConnection) $URI.openConnection();
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      import java.net.Socket;
                      ...
                  - pattern-not-regex: .*\.getDefaultHostnameVerifier().*
              - patterns:
                  - pattern-inside: |
                      import javax.net.ssl.SSLSocket;
                      ...
                  - pattern-not-regex: .*\.getDefaultHostnameVerifier().*
