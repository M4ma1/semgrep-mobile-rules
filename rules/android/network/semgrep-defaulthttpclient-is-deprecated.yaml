rules:
  - id: android.semgrep.defaulthttpclient-is-deprecated
    languages:
      - kotlin
    severity: WARNING
    message: >-
      DefaultHttpClient is deprecated. Further, it does not support connections using TLS1.2,
      which makes using DefaultHttpClient a security hazard. Use SystemDefaultHttpClient instead,
      which supports TLS1.2.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-326: Inadequate Encryption Strength'
      impact: LOW
      likelihood: LOW
      references:
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
        - https://find-sec-bugs.github.io/bugs.htm#DEFAULT_HTTP_CLIENT
        - https://cwe.mitre.org/data/definitions/326.html
        - https://mas.owasp.org/MASVS/controls/MASVS-NETWORK-1/
      subcategory:
        - vuln
      technology:
        - android
        - kotlin
      owasp:
        - A03:2017 - Sensitive Data Exposure
        - A02:2021 - Cryptographic Failures
        - A04:2025 - Cryptographic Failures
      asvs:
        section: V9 Communications Verification Requirements
        control_id: 9.1.3 Weak TLS
        control_url: https://github.com/OWASP/ASVS/blob/master/4.0/en/0x17-V9-Communications.md#v91-client-communications-security-requirements
        version: '4'
    pattern: DefaultHttpClient(...)
    fix-regex:
      regex: DefaultHttpClient
      replacement: SystemDefaultHttpClient
