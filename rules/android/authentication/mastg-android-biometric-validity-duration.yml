rules:
  - id: android.owasp.biometric-validity-duration
    languages:
      - java
      - kotlin
    severity: WARNING
    message: >-
      [MASVS-AUTH-2] Key configured with authentication validity duration > 0. For sensitive
      operations, use setUserAuthenticationParameters(0, type) to require authentication for
      every cryptographic operation.

    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-287: Improper Authentication'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/287.html
        - https://mas.owasp.org/MASVS/controls/MASVS-AUTH-2/
      subcategory:
        - vuln
      technology:
        - android
      summary: This rule detects KeyGenParameterSpec configurations with extended authentication validity duration (non-zero timeout).
    pattern-either:
      # Pattern 1: setUserAuthenticationParameters with non-zero duration
      - patterns:
          - pattern: $BUILDER.setUserAuthenticationParameters($DURATION, ...)
          - metavariable-comparison:
              metavariable: $DURATION
              comparison: $DURATION > 0
      # Pattern 2: Deprecated setUserAuthenticationValidityDurationSeconds with non-zero duration
      - patterns:
          - pattern: $BUILDER.setUserAuthenticationValidityDurationSeconds($DURATION)
          - metavariable-comparison:
              metavariable: $DURATION
              comparison: $DURATION > 0
