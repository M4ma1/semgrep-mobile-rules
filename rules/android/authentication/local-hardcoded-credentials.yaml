rules:
  - id: android.local.webview-hardcoded-http-auth
    languages:
      - java
      - kotlin
    severity: ERROR
    message: >-
      WebView HTTP authentication uses hardcoded credentials. Obtain credentials from an
      authenticated flow or protected credential store instead.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-798: Use of Hard-coded Credentials'
      impact: HIGH
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://mas.owasp.org/MASVS/controls/MASVS-STORAGE-1/
      subcategory:
        - vuln
      technology:
        - android
    pattern: $HANDLER.proceed("...", "...")

  - id: android.local.jdbc-hardcoded-credentials
    languages:
      - java
      - kotlin
    severity: ERROR
    message: >-
      JDBC connection is opened with hardcoded credentials. Retrieve database credentials from a
      protected secret provider and do not ship them in a mobile application.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-798: Use of Hard-coded Credentials'
      impact: HIGH
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://mas.owasp.org/MASVS/controls/MASVS-STORAGE-1/
      subcategory:
        - vuln
      technology:
        - android
        - jdbc
    pattern: DriverManager.getConnection($URL, "...", "...")
