rules:
  - id: MSTG-ARCH-9
    languages:
      - java
    severity: WARNING
    message: The main activity does not implement a mechanism for enforcing updates.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-693: Protection Mechanism Failure'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05h-Testing-Platform-Interaction.md#testing-enforced-updating-mstg-arch-9
        - https://cwe.mitre.org/data/definitions/693.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CODE-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: M7
      area: arch
      verification-level:
        - L2
      authors:
        - Riccardo Cardelli @gand3lf (IMQ Minded Security)
    mode: join
    join:
      rules:
        - id: activity-without-update
          languages:
            - java
          patterns:
            - pattern: |
                public class $CLASSNAME extends $ACTIVITY{
                    public void onCreate(...){...}
                }
            - pattern-not: |
                public class $CLASSNAME extends $ACTIVITY{
                    $X(...){
                    ...
                    (AppUpdateManager $Y).startUpdateFlowForResult(...);
                    ...
                    }
                }
            - focus-metavariable:
                - $CLASSNAME
        - id: main-activity
          languages:
            - xml
          patterns:
            - pattern: |
                <activity ... android:name="$ACT" ...> ...
                <intent-filter> ...
                <action android:name="android.intent.action.MAIN"/> ...
                <category android:name="android.intent.category.LAUNCHER"/> ...
                </intent-filter> ...
                </activity>
            - focus-metavariable:
                - $ACT
      on:
        - main-activity.$ACT > activity-without-update.$CLASSNAME
