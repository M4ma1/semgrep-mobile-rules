rules:
  - id: android.mobsf.android_root_detection
    languages:
      - java
    severity: INFO
    message: >-
      This app does not have root detection capabilities. Running a sensitive application on a
      rooted device questions the device integrity and affects users data.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-919: Weaknesses in Mobile Applications'
      impact: LOW
      likelihood: LOW
      references:
        - https://github.com/MobSF/owasp-mstg/blob/master/Document/0x05j-Testing-Resiliency-Against-Reverse-Engineering.md#testing-root-detection-mstg-resilience-1
        - https://cwe.mitre.org/data/definitions/919.html
        - https://mas.owasp.org/MASVS/controls/MASVS-RESILIENCE-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: m8
      masvs: resilience-1
    patterns:
      - pattern-either:
          - pattern: |
              $J.isJailBroken(...)
          - pattern: |
              $R.isDeviceRooted(...)
          - pattern: |
              $R.isRooted(...)
          - pattern: |
              RootTools.isAccessGiven(...)
          - pattern: |
              $MTD.contains("test-keys")
