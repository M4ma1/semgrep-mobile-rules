# yamllint enable
rules:
  - id: android.gitlab.kotlin_crypto_rule-InsufficientKeySizeRsa
    languages:
      - kotlin
    severity: WARNING
    message: Detected an insufficient key size for DSA. NIST recommends a key size of 2048 or higher.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-326: Inadequate Encryption Strength'
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/326.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CRYPTO-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp:
        - A3:2017-Sensitive Data Exposure
        - A02:2021-Cryptographic Failures
      security-severity: MEDIUM
      shortDescription: Inadequate encryption strength
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  $GEN = KeyPairGenerator.getInstance($ALG, ...);
                  ...
              - pattern-either:
                  - pattern: $VAR.initialize($SIZE, ...);
                  - pattern: java.security.spec.RSAKeyGenParameterSpec($SIZE,...);
              - metavariable-comparison:
                  comparison: $SIZE < 2048
                  metavariable: $SIZE
              - metavariable-regex:
                  metavariable: $ALG
                  regex: '"(RSA|DSA)"'
