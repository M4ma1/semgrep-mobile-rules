rules:
  - id: android.insecure_null_cipher
    languages:
      - java
      - kotlin
      - scala
    severity: WARNING
    message: >-
      NullCipher was detected. A NullCipher implements the Cipher interface by returning
      ciphertext identical to the supplied plaintext, so nothing is encrypted. It is only
      appropriate in tests. Its accidental use introduces a significant confidentiality risk. Use
      a real cipher such as Cipher.getInstance("AES/GCM/NoPadding").
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://find-sec-bugs.github.io/bugs.htm#NULL_CIPHER
        - https://owasp.org/www-community/Using_the_Java_Cryptographic_Extensions
        - https://cwe.mitre.org/data/definitions/327.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CRYPTO-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mas:
        identifier: MASVS-CRYPTO-1
        area: cryptography
        level:
          - L1
          - L2
      replaces:
        - android.gitlab.kotlin_crypto_rule-NullCipher
        - android.semgrep.no-null-cipher
        - android.mobsf.weak_cipher (NullCipher branch only)
    pattern-either:
      - pattern: new NullCipher(...)
      - pattern: new javax.crypto.NullCipher(...)
      - pattern: NullCipher(...)
      - pattern: javax.crypto.NullCipher(...)
