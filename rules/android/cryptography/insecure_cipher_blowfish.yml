rules:
  - id: android.insecure_cipher_blowfish
    severity: INFO
    languages: 
      - java
      - kotlin
    metadata:
      category: security
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      owasp-mas:
        identifier: MASVS-CRYPTO-1
        area: cryptography
        level:
          - L1
          - L2
      references:
        - https://mas.owasp.org/MASTG/General/0x04g-Testing-Cryptography/#identifying-insecure-andor-deprecated-cryptographic-algorithms
        - https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html#cipher-modes
      replaces:
        - android.mobsf.weak_cipher (Blowfish branch)
        - android.owasp.broken-encryption-algorithms (Blowfish branch)
    message: >-
      This Android mobile application seems using the insecure Blowfish cipher, which could expose to various kind of vulnerabilities.
      It is recommended to use the `AES` cipher instead.
    pattern-either:
      - pattern: $C.getInstance("=~/(Blowfish\/.*\/.*|Blowfish)/i", ...)
