# yamllint enable
rules:
  - id: android.gitlab.kotlin_crypto_rule-HazelcastSymmetricEncryption
    languages:
      - kotlin
    severity: WARNING
    message: >-
      The network communications for Hazelcast is configured to use a symmetric cipher (probably
      DES or Blowfish). Those ciphers alone do not provide integrity or secure authentication.
      The use of asymmetric encryption is preferred.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-326: Inadequate Encryption Strength'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/326.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CRYPTO-1/
      subcategory:
        - vuln
      technology:
        - android
        - kotlin
      owasp:
        - A3:2017-Sensitive Data Exposure
        - A02:2021-Cryptographic Failures
      security-severity: MEDIUM
      shortDescription: Inadequate encryption strength
    pattern: com.hazelcast.config.SymmetricEncryptionConfig()
