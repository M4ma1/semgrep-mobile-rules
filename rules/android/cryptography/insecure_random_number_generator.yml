rules:
  - id: android.insecure_random_number_generator
    languages:
      - java
      - kotlin
    severity: WARNING
    message: >-
      This Android mobile application seems using an insecure random number generator, which
      could expose to various kind of vulnerabilities. If the source of entropy is used for
      security purposes, make sure to use the `SecureRandom` API without specifying a seed.
    metadata:
      category: security
      confidence: LOW
      cwe:
        - 'CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)'
      impact: LOW
      likelihood: LOW
      references:
        - https://mas.owasp.org/MASTG/tests/android/MASVS-CRYPTO/MASTG-TEST-0016/
        - https://cwe.mitre.org/data/definitions/338.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CRYPTO-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mas:
        identifier: MASVS-CRYPTO-1
        area: cryptography
        level:
          - L1
          - L2
      replaces:
        - android.owasp.random-apis-insufficient-entropy
    pattern-either:
      - pattern: new SecureRandom($SEED);
      - pattern: SecureRandom($SEED);
      - pattern: new Random()
      - pattern: Random()
      - pattern: Math.random(...)
      - pattern: (java.util.Random $X).$Y(...)
