rules:
  - id: android.insecure_hash_sha224
    languages:
      - java
      - kotlin
    severity: WARNING
    message: >-
      This Android mobile application seems using the insecure SHA-224 algorithm, which could
      expose to various kind of vulnerabilities. It is recommended to use the `SHA-256` or `SHA3`
      algorithm instead.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-328: Use of Weak Hash'
      impact: HIGH
      likelihood: HIGH
      references:
        - https://mas.owasp.org/MASTG/General/0x04g-Testing-Cryptography/#identifying-insecure-andor-deprecated-cryptographic-algorithms
        - https://cheatsheetseries.owasp.org/cheatsheets/Cryptographic_Storage_Cheat_Sheet.html#cipher-modes
        - https://cwe.mitre.org/data/definitions/328.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CRYPTO-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mas:
        identifier: MASVS-CRYPTO-1
        area: cryptography
        level:
          - L1
          - L2
    pattern-either:
      - pattern: $VAR = MessageDigest.getInstance("SHA-224")
