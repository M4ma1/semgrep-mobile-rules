# source (original): https://find-sec-bugs.github.io/bugs.htm
# yamllint enable
rules:
  - id: android.gitlab.kotlin_crypto_rule-WeakTLSProtocol
    languages:
      - kotlin
    severity: WARNING
    message: >-
      A HostnameVerifier that accept any host are often use because of certificate reuse on many
      hosts. As a consequence, this is vulnerable to Man-in-the-middleattacks attacks since the
      client will trust any certificate.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-295: Improper Certificate Validation'
      impact: HIGH
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/295.html
        - https://mas.owasp.org/MASVS/controls/MASVS-NETWORK-1/
      subcategory:
        - vuln
      technology:
        - android
      owasp:
        - A3:2017-Sensitive Data Exposure
        - A02:2021-Cryptographic Failures
      security-severity: MEDIUM
      shortDescription: Improper certificate validation
    patterns:
      - pattern-either:
          - pattern: org.apache.http.impl.client.DefaultHttpClient()
          - pattern: javax.net.ssl.SSLContext.getInstance("SSL")
