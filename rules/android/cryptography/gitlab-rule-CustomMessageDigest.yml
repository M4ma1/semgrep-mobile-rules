# yamllint enable
rules:
  - id: android.gitlab.kotlin_crypto_rule-CustomMessageDigest
    languages:
      - kotlin
    severity: WARNING
    message: >-
      Implementing a custom MessageDigest is error-prone. National Institute of Standards and
      Technology(NIST) recommends the use of SHA-224, SHA-256, SHA-384, SHA-512, SHA-512/224, or
      SHA-512/256.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
      impact: MEDIUM
      likelihood: LOW
      references:
        - https://cwe.mitre.org/data/definitions/327.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CRYPTO-1/
      subcategory:
        - vuln
      technology:
        - android
        - kotlin
      owasp:
        - A6:2017-Security Misconfiguration
        - A04:2021-Insecure Design
      security-severity: MEDIUM
      shortDescription: Use of a broken or risky cryptographic algorithm
    pattern: |
      class $CLAZZ : java.security.MessageDigest(...) {
        ...
      }
