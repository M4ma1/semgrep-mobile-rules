# yamllint enable
rules:
  - id: android.gitlab.kotlin_crypto_rule-BlowfishKeySize
    languages:
      - kotlin
    severity: WARNING
    message: >-
      A small key size makes the ciphertext vulnerable to brute force attacks. At least 128 bits
      of entropy should be used when generating the key if use of Blowfish is required.
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - 'CWE-326: Inadequate Encryption Strength'
      impact: MEDIUM
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/326.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CRYPTO-1/
      subcategory:
        - vuln
      technology:
        - android
        - kotlin
      owasp:
        - A3:2017-Sensitive Data Exposure
        - A02:2021-Cryptographic Failures
      security-severity: MEDIUM
      shortDescription: Inadequate encryption strength
    patterns:
      - pattern-inside: |
          $KEYGEN = javax.crypto.KeyGenerator.getInstance("Blowfish", ...);
          ...
          $KEYGEN.init($KEY_SIZE);
      - metavariable-comparison:
          comparison: $KEY_SIZE < 128
          metavariable: $KEY_SIZE
