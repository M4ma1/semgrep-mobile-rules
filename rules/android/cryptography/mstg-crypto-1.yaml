rules:
  - id: MSTG-CRYPTO-1
    languages:
      - java
    severity: WARNING
    message: >-
      The application relies on symmetric cryptography with hardcoded keys as a single method of
      encryption.
    metadata:
      category: security
      confidence: MEDIUM
      cwe:
        - 'CWE-321: Use of Hard-coded Cryptographic Key'
      impact: HIGH
      likelihood: MEDIUM
      references:
        - https://github.com/OWASP/owasp-mastg/blob/v1.5.0/Document/0x05e-Testing-Cryptography.md#testing-symmetric-cryptography-mstg-crypto-1
        - https://cwe.mitre.org/data/definitions/321.html
        - https://mas.owasp.org/MASVS/controls/MASVS-CRYPTO-2/
      subcategory:
        - vuln
      technology:
        - android
      owasp-mobile: M2
      area: cryptography
      verification-level:
        - L1
        - L2
      authors:
        - Riccardo Cardelli @gand3lf (IMQ Minded Security)
      replaces:
        - android.mobsf.aes_hardcoded_key
        - android.owasp.hardcoded-crypto-keys-usage
    options:
      symbolic_propagation: true
    pattern-either:
      - patterns:
          - pattern: |
              class $CLASS{ ...
              byte[] $K = new byte[]{$X, ...};
              ...
              $M(...){ ...
                new SecretKeySpec(this.$K,...);
              ... }
              ...}
          - focus-metavariable:
              - $K
      - patterns:
          - pattern: |
              class $CLASS{ ...
              String $K = "=~/.+/";
              ...
              $M(...){ ...
                new SecretKeySpec(this.$K.$TB(),...);
              ... }
              ...}
          - metavariable-regex:
              metavariable: $TB
              regex: (toByteArray|getBytes)
          - focus-metavariable:
              - $K
      - patterns:
          - pattern: |
              class $CLASS{ ...
              ...
              $M(...){ ...
                new SecretKeySpec($K.$TB(),...);
              ... }
              ...}
          - metavariable-regex:
              metavariable: $TB
              regex: (toByteArray|getBytes)
          - metavariable-pattern:
              metavariable: $K
              pattern-either:
                - pattern: getString(...)
                - pattern: $X.getString(...)
          - focus-metavariable:
              - $K
      # Hardcoded literal key passed to SecretKeySpec (directly, or through a local variable via symbolic propagation)
      - pattern: new SecretKeySpec("...".getBytes(...), $ALGO)
      - pattern: new SecretKeySpec(new byte[]{...}, $ALGO)
      - pattern: |
          byte[] $K = {...};
          ...
          new SecretKeySpec($K, $ALGO);
